<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your AI Employee — Build Board</title>
<meta name="description" content="Your whole build journey on one board — what to do next up top, every checkpoint below. Finish one and the next unlocks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="journey.css?v=4">
<style>
body{min-height:100vh;background:radial-gradient(1100px 600px at 50% -260px,rgba(45,140,60,.05),transparent 70%),var(--bg)}

/* ── TOP BAR (brand + swappable surface toggle; no sidebar) ── */
/* Resources rail — the way into the wider portal. Deliberately quiet while the
   journey is unfinished (the board is meant to be the focus), and promoted to a
   full card once everything is built, when the portal becomes the reference library.
   While unfinished it is ONE collapsed line: no colour, no card, no border — it
   must never compete with the next-action banner or pull anyone off the wizard. */
.res{max-width:1300px;margin:26px auto 0;padding:0 24px}
.res-more{text-align:center}
.res-btn{background:none;border:0;font-family:var(--font-body);font-size:13.5px;color:var(--text-dim);cursor:pointer;padding:7px 12px;border-radius:8px;transition:color .14s}
.res-btn:hover{color:var(--text)}
.res-btn .car{display:inline-block;transition:transform .2s}
.res-more.open .res-btn .car{transform:rotate(180deg)}
.res-panel{overflow:hidden;max-height:0;transition:max-height .26s ease}
.res-more.open .res-panel{max-height:260px}
.res-panel .res-links{justify-content:center;padding:12px 2px 4px}
.res-card{border:2px solid var(--ink);border-radius:15px 4px 15px 4px;background:var(--card);box-shadow:3px 4px 0 rgba(33,33,30,.08);padding:22px 24px}
.res-card h3{font-family:var(--font-accent,inherit);font-size:19px;color:var(--ink);margin:0 0 4px}
.res-card p{color:var(--soft);font-size:14px;margin:0 0 16px}
.res-links{display:flex;flex-wrap:wrap;gap:10px}
.res-links a{display:inline-block;padding:9px 15px;border:1.5px solid var(--ink);border-radius:12px 3px 12px 3px;background:var(--card);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600;transition:transform .13s,box-shadow .13s}
.res-links a:hover{transform:translate(-1px,-1px);box-shadow:3px 4px 0 rgba(33,33,30,.12)}

/* ── SIGN-IN GATE ─────────────────────────────────────────────────────────
   The board is buyer-only in practice — people arrive from onboarding or from
   Claude, never by browsing — so signing in first costs nothing and removes
   every half-state. Above all it removes the one that mattered: a board that
   cannot identify you can no longer announce "Start here - step 1" at someone
   four checkpoints in. It simply is not drawn. */
/* `display:flex` on the class beats the [hidden] attribute's UA display:none,
   so without this the checking and sign-in views render stacked on top of each
   other. Any class here that sets `display` needs the same guard. */
[hidden]{display:none !important}
.signin-wrap{min-height:62vh;display:flex;align-items:center;justify-content:center;padding:24px}
.signin-card{max-width:420px;width:100%;text-align:center;border:2px solid var(--ink);border-radius:18px 5px 18px 5px;background:var(--card);box-shadow:4px 5px 0 rgba(33,33,30,.09);padding:38px 30px}
.signin-card img{margin-bottom:14px}
.signin-card h1{font-family:var(--font-accent,inherit);font-size:24px;color:var(--ink);margin:0 0 8px}
.signin-card p{color:var(--soft);font-size:14.5px;line-height:1.55;margin:0 0 22px}
.signin-card #gbtn{display:flex;justify-content:center;min-height:44px}
.signin-err{font-size:13px;color:#b91c1c;margin-top:14px}
/* The checking state is deliberately almost blank. It exists to stop a flash of
   the wrong view while the cookie is resolved server-side, not to be noticed. */
.signin-dots{color:var(--text-dim);font-size:13.5px}
.whoami{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-left:auto}
.auth-link{background:none;border:0;font-family:var(--font-body);font-size:12.5px;color:var(--soft);text-decoration:underline;cursor:pointer;padding:2px 4px}
.auth-link:hover{color:var(--ink)}
@media (max-width:560px){.whoami{font-size:11.5px}.signin-card{padding:30px 22px}}
/* Top bar unified with the course-page shell (.clo-topbar): full-width sticky, blurred, one bottom rule, dark 13px brand + 26px logo — reproduced with the board's own tokens so no shell.css import is needed. */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:8px 24px;background:rgba(250,250,250,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1.5px solid var(--border-2);margin-bottom:20px}
.brand{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--ink);display:inline-flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{height:26px;width:auto}
.surf{display:inline-flex;align-items:center;gap:9px}
.surf .surface-label{font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px}
.surface-toggle{display:inline-flex;background:var(--surface);border:1px solid var(--border-2);border-radius:20px;padding:3px;gap:3px}
.sbtn{font-family:var(--font-body);font-size:12px;font-weight:700;padding:5px 13px;border-radius:16px;border:0;background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s}
.sbtn:hover{color:var(--text)}
.sbtn.active{background:var(--accent-dim);color:var(--accent)}

/* ── OVERALL PROGRESS (toward a finished AI Employee) ── */
.head{max-width:640px;margin:0 auto;padding:0 22px}
.oprog{margin:16px auto 2px}
.oprog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;gap:12px}
.oprog-label{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--text)}
.oprog-pct{font-size:14px;font-weight:800;color:var(--accent)}
.oprog-bar{height:9px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.oprog-fill{height:100%;width:0;border-radius:6px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.oprog-next{margin-top:9px;font-size:13px;color:var(--text-muted);text-align:center}
.oprog-next b{color:var(--text)}

/* ── "WHAT TO WORK ON NEXT" banner ── */
.nextbar{max-width:640px;margin:18px auto 4px;background:linear-gradient(120deg,color-mix(in srgb,var(--nc) 17%,var(--surface)),var(--surface) 72%);border:1px solid color-mix(in srgb,var(--nc) 44%,transparent);border-radius:var(--radius-lg);padding:18px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:4px 5px 0 rgba(33,33,30,.1)}
.nb-main{flex:1;min-width:210px}
.nb-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--nc);margin-bottom:5px}
.nb-title{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.12}
.nb-lead{font-size:13.5px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.nb-go{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:12px;background:var(--nc);color:#fff;font-weight:800;font-size:15px;text-decoration:none;box-shadow:0 12px 30px color-mix(in srgb,var(--nc) 30%,transparent);transition:filter .14s,transform .14s}
.nb-go:hover{filter:brightness(1.07);transform:translateY(-1px);text-decoration:none;color:#fff}

.map-label{max-width:1300px;margin:26px auto 0;padding:0 24px;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--text-dim);text-align:center}

/* ── FULL BOARD — fits the width, no horizontal scrollbar ── */
.board-wrap{padding:12px 24px 46px}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px;max-width:1300px;margin:0 auto;align-items:start}
/* Six → three at tablet width. Below 760px it stops being a grid at all and
   becomes the collapsible stack at the bottom of this stylesheet — two 150px
   columns on a phone made every card title wrap after two words. */
@media(max-width:1120px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}

/* The column header is a button so it can be the expander on a phone. On
   desktop it must look and behave exactly like the label it replaced — hence
   the full button reset here rather than a class on top of UA styles. */
.col-head{display:flex;align-items:center;gap:6px;padding:2px 2px 4px;width:100%;
  background:none;border:0;font-family:inherit;text-align:left;cursor:default;color:inherit}
.col-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:12px;font-weight:800;padding:4px 9px;border-radius:7px;background:color-mix(in srgb,var(--cp) 16%,transparent);color:var(--cp);border:1px solid color-mix(in srgb,var(--cp) 32%,transparent);min-width:0}
.col-pill span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-pill .cdot{width:7px;height:7px;border-radius:50%;background:var(--cp);flex-shrink:0}
.col-state{margin-left:auto;font-size:10.5px;font-weight:700;white-space:nowrap}
.col-state.done{color:var(--accent)}
.col-state.active{color:var(--cp)}
.col-state.locked{color:var(--text-400,#6B6B63)}
.col-chev{display:none}
.col-body{background:color-mix(in srgb,var(--cp) 5%,var(--surface));border:1px solid var(--border);border-top:3px solid var(--cp);border-radius:var(--radius-lg);padding:10px;display:flex;flex-direction:column;gap:9px;min-height:80px}
.col.active .col-body{border-color:color-mix(in srgb,var(--cp) 40%,transparent);box-shadow:3px 4px 0 rgba(33,33,30,.10),0 0 0 1px color-mix(in srgb,var(--cp) 30%,transparent)}
.col.locked .col-body{opacity:.7}
.klist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}

/* ── STEP CARDS — a real checklist, not a picture of one ──────────────────
   Each card carries a tick (click = done/not done) and a body that deep-links
   into that exact step of the wizard. Both targets are ≥40px so a thumb can
   hit either one without hitting the other. */
.kcard{position:relative;display:flex;align-items:flex-start;gap:9px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;padding:9px 10px;transition:border-color .13s,box-shadow .13s,transform .13s}
.kcard.is-live:hover{border-color:color-mix(in srgb,var(--cp) 45%,transparent);box-shadow:2px 3px 0 rgba(33,33,30,.08);transform:translate(-1px,-1px)}
.kcard:focus-within{border-color:color-mix(in srgb,var(--cp) 55%,transparent)}
.kcard.is-doing{border-color:color-mix(in srgb,var(--cp) 50%,transparent);background:color-mix(in srgb,var(--cp) 7%,var(--surface))}

.ktick{position:relative;z-index:2;flex-shrink:0;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid var(--border-ink);background:var(--surface);
  color:transparent;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;font-family:var(--font-body)}
button.ktick{cursor:pointer;transition:background .12s,border-color .12s,transform .12s}
/* The 20px dot is the visual size; the tap target around it is 40px. Without
   this a tick is a coin-flip on a phone, and mis-ticking a checkpoint cascades. */
button.ktick::after{content:'';position:absolute;left:0;top:0;width:40px;height:40px;transform:translate(-10px,-10px)}
button.ktick:hover{border-color:var(--cp);background:color-mix(in srgb,var(--cp) 14%,var(--surface))}
button.ktick:active{transform:scale(.9)}
.kcard.is-done .ktick{background:var(--accent);border-color:var(--accent);color:#fff}
.kcard.is-doing .ktick{border-color:var(--cp);color:var(--cp);font-size:8px}
.ktick.static{opacity:.55}

.kbody{flex:1;min-width:0;display:block;color:inherit;text-decoration:none}
a.kbody:hover{text-decoration:none}
/* Stretched link: the WHOLE card opens its step, not just the words. Ticking
   still wins inside its own zone — .ktick is the only positioned child with a
   z-index, so it sits above this overlay. */
a.kbody::after{content:'';position:absolute;inset:0;border-radius:9px}
.kcard .ktitle{display:block;font-size:13px;font-weight:600;color:var(--text);line-height:1.35}
.kcard.is-done .ktitle{color:var(--text-muted)}
.kgo{position:absolute;right:9px;top:9px;font-size:12px;font-weight:800;color:var(--cp);opacity:0;transition:opacity .13s,transform .13s}
.kcard.is-live:hover .kgo,.kcard:focus-within .kgo{opacity:.85;transform:translateX(2px)}
.ktags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.type{background:var(--surface-3);color:var(--text-muted);border:1px solid var(--border-2)}
.tag.opt{background:transparent;color:var(--text-dim);border:1px dashed var(--border-2)}
.tag.st-doing{background:rgba(37,99,168,.12);color:#2563A8}
.tag.st-done{background:var(--accent-dim);color:var(--accent)}
.tag.st-doing::before{content:'◐';font-size:9px}
.tag.st-done::before{content:'●';font-size:9px}

/* Column footer — the way in, and the way back out of a finished checkpoint */
.col-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 2px 0;margin-top:1px}
.col-go{font-size:12px;font-weight:800;color:var(--cp);text-decoration:none}
.col-go:hover{text-decoration:underline}
.col-undo,.col-hint{font-family:var(--font-body);font-size:11.5px;color:var(--text-dim)}
.col-undo{margin-left:auto;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:6px;transition:color .13s,background .13s}
.col-undo:hover{color:var(--text);background:var(--surface-3)}

/* ── RESET / RESTORE ──────────────────────────────────────────────────────
   Quiet on purpose. It is a real control a buyer may want (start the journey
   over), and the one Rashid drives during a live walkthrough — but it must
   never read as a next action next to the checkpoint columns. */
.admin{max-width:1300px;margin:6px auto 0;padding:0 24px;text-align:center}
.admin-note{display:block;font-size:12.5px;color:#B26B00;margin-bottom:9px}
.admin-row{display:inline-flex;gap:9px;flex-wrap:wrap;justify-content:center}
.admin-btn{font-family:var(--font-body);font-size:12.5px;color:var(--text-dim);background:none;border:1px solid transparent;border-radius:8px;padding:8px 13px;cursor:pointer;transition:all .14s;min-height:38px}
.admin-btn:hover{color:var(--text);border-color:var(--border-2);background:var(--surface)}
.admin-btn.primary{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-dim)}
.admin-btn.primary:hover{border-color:var(--accent)}

.footer{text-align:center;padding:6px 24px 54px;font-size:13px;color:var(--text-dim)}
.footer a{font-weight:600}

/* ── MOBILE: the board becomes a stack of collapsible checkpoints ─────────
   Six kanban columns squeezed into a 375px viewport gave ~150px each, which
   turns every card title into four wrapped words and buries the active
   checkpoint below three finished ones. Stacked and collapsible, the phone
   shows the checkpoint you are on, open, with the rest one tap away. */
@media(max-width:760px){
  .board-wrap{padding:8px 12px 34px}
  .board{grid-template-columns:1fr;gap:10px}
  .col{gap:0}
  .col-head{cursor:pointer;gap:8px;padding:11px 12px;min-height:52px;
    background:var(--surface);border:1px solid var(--border-2);border-left:4px solid var(--cp);border-radius:11px}
  .col.open .col-head{border-radius:11px 11px 0 0;border-bottom-color:transparent}
  .col-pill{font-size:12.5px;padding:3px 8px}
  .col-chev{display:block;font-size:11px;color:var(--text-dim);transition:transform .2s;flex-shrink:0}
  .col.open .col-chev{transform:rotate(180deg)}
  .col-state{margin-left:0}
  .col-body{display:none;border-radius:0 0 11px 11px;border-top:0;border-left:4px solid var(--cp)}
  .col.open .col-body{display:flex}
  .col.active .col-body{box-shadow:none}
  .kcard{padding:11px 11px}
  .kcard .ktitle{font-size:14px}
  .kgo{opacity:.5;position:static;display:block;margin-top:6px;text-align:right}
  .ktick{width:24px;height:24px;font-size:13px}
  .col-foot{padding:6px 2px 2px;min-height:38px}
  .col-go{padding:7px 2px}
  .col-undo{padding:7px 8px}

  /* Header block */
  .topbar{padding:8px 13px;gap:10px;min-height:52px}
  .brand{font-size:12px;gap:8px}
  .head{padding:0 14px}
  .map-label{margin-top:20px;padding:0 14px}
  .nextbar{margin:14px 12px 4px;padding:15px 16px;gap:14px}
  .nb-title{font-size:19px}
  .nb-go{width:100%;justify-content:center;padding:14px 20px}
  .res{padding:0 14px}
  /* Full-width stacked rows. `flex:1` on an inline-flex row crushed the two
     buttons to 76px each and wrapped "Reset all progress" over three lines. */
  .admin{padding:0 14px}

<script>
/* ──────────────────────────────────────────────────────────────
   BOARD PAGE. Top: what to work on NEXT (from progress.js). Below:
   the whole journey rendered to fit — no horizontal scrollbar. The
   wizards stay full-focus (they never render this board).
   ────────────────────────────────────────────────────────────── */

var FOCUS_LEAD = {
  cp1:'Map how your business runs today and find the one job worth handing off first. You just answer its questions.',
  cp2:'Take that one job and turn it into a reusable skill — the AI does it your way, every time.',
  cp3:'Chain a few skills into a system that runs a whole function from start to finish.',
  cp4:'Add the guardrails so it checks its own work and fails loudly instead of quietly.',
  goal:'Put it on a schedule so it runs the whole function without you starting it.'
};

/* Journey palette, paper-strength (2026-07-25). These were the dark-skin pastels
   (#4ade80 #5b9bff #a78bfa #f5a623 #f472b6 #fbbf24) — fine as glowing text on #0d0d0d,
   washed out to 1.2-1.8:1 as ink on #FAFAFA. Same six hues, darkened until they read.
   Anything painting TEXT in a column colour depends on these staying dark: the column
   pills, the next-up badge, and .nb-go (white text ON the colour). */
var TYPES = {
  action:{ label:'Action', ic:'⚡' }, video:{ label:'Watch', ic:'📹' },
  build:{ label:'Build', ic:'🔨' }, gate:{ label:'Done-signal', ic:'🎯' }, outcome:{ label:'Outcome', ic:'🌟' },
  share:{ label:'Share', ic:'🔗' }   // matches checkpoint-map.html's type:'share' step
};
/* ══ THE CARD↔STEP CONTRACT ═══════════════════════════════════════════════
   Every card below is ONE STEP of that checkpoint's wizard, in the wizard's
   own order, carrying the wizard's own title and its `surface` filter. That is
   not a stylistic preference any more — it is load-bearing in two directions:

     · a card's INDEX is its step number, so clicking it deep-links to
       `<wizard>?step=N` and must land on the step whose title you just read;
     · a card's STATUS is read straight off the wizard's saved position, so a
       card the wizard does not have shifts every status after it by one.

   The drift this replaces was real: cp1's column advertised a video deleted
   from its wizard, cp4 listed 3 cards against 5 steps, and `goal` listed 3
   against 4 — so the right-hand half of the board narrated a journey nobody
   was on. When a wizard's steps change, change them here in the same commit.
   `surface` mirrors the wizard's own field: absent = shown on both.
   ════════════════════════════════════════════════════════════════════════ */
var BOARD = [
  /* `setup` is the exception, and deliberately so. get-access-aieb.html predates
     the position model and keeps a SET of finished steps per track, with two
     tracks of different lengths — so these four cards SUMMARISE it rather than
     mirroring it, and the column is ticked as a whole instead of per card. */
  { id:'setup', name:'Get set up', color:'#2D8C3C', summary:true, cards:[
    { t:'Join the community', type:'action' },
    { t:'Install the plugin + connect', type:'action' },
    { t:'Onboard your Business OS', type:'action' },
    { t:'Welcome — what you just built', type:'video' }
  ]},
  { id:'cp1', name:'Map the business', color:'#2563A8', cards:[
    { t:'Set up Draw.io — connector + app', type:'build', surface:'cowork' },
    { t:'Set up Draw.io — MCP + app',       type:'build', surface:'claude-code' },
    { t:'Set up Draw.io — MCP + app',       type:'build', surface:'codex' },
    { t:'Run your Business X-Ray', type:'build', surface:'cowork' },
    { t:'Run your Business X-Ray', type:'build', surface:'claude-code' },
    { t:'Run your Business X-Ray', type:'build', surface:'codex' },
    { t:'Read &amp; share your X-Ray', type:'share', optional:true },
    { t:'Lock your first target', type:'gate' }
  ]},
  { id:'cp2', name:'Your first skill', color:'#6B46C1', cards:[
    { t:'What is a skill', type:'video' },
    { t:'The 3 levels of skills', type:'video' },
    { t:'How to create a skill', type:'video' },
    { t:'Turn 1 real process into a skill', type:'build' },
    /* Self-improvement sits HERE, not in the goal column — it's the feedback loop that
       makes every later run better, so it has to land the moment they first run a skill. */
    { t:'It gets better every time you use it', type:'build' },
    { t:'Skill ran once on real data', type:'gate' }
  ]},
  { id:'cp3', name:'A skill system', color:'#B26B00', cards:[
    { t:'What a skill system is', type:'video' },
    { t:'Wire your skill into a system', type:'build' },
    { t:'System runs a whole function', type:'gate' }
  ]},
  { id:'cp4', name:'Make it reliable', color:'#A83A6B', cards:[
    { t:'Review + harden', type:'video' },
    { t:'Harden it — do it', type:'build' },
    { t:'Build a harness', type:'video' },
    { t:'Build the harness — do it', type:'build' },
    { t:'It catches its own mistakes', type:'gate' }
  ]},
  /* `goal` is a REAL checkpoint now (2026-07-24), not a trophy column: autonomy moved here
     from cp4, because running without you is what MAKES it an AI Employee. */
  { id:'goal', name:'Your AI Employee', color:'#C2410C', cards:[
    { t:'Schedule it / autonomy', type:'video' },
    { t:'Schedule it — do it', type:'build', surface:'cowork' },
    { t:'Schedule it — do it', type:'build', surface:'claude-code' },
    { t:'Schedule it — do it', type:'build', surface:'codex' },
    { t:'Let it run a full cycle without you', type:'build' },
    { t:'It runs on its own', type:'gate' }
  ]}
];
var STATUS = { doing:'In progress', done:'Completed' };
var WIZARDS = { setup:'get-access-aieb.html', cp1:'checkpoint-map.html?v=8', cp2:'checkpoint-first-skill.html', cp3:'checkpoint-system.html', cp4:'checkpoint-autonomy.html', goal:'checkpoint-ai-employee.html' };

/* ---- SURFACE: swappable toggle + first-time gate ---- */
function surfBarHTML(){
  var cur = AIEB.getSurface();
  function btn(k){ return '<button class="sbtn'+(cur===k?' active':'')+'" onclick="swapSurface(\''+k+'\')">'+AIEB.SURFACES[k].label+'</button>'; }
  return '<span class="surface-label">Building in</span><div class="surface-toggle">'+btn('cowork')+btn('claude-code')+btn('codex')+'</div>';
}
function paintSurf(){ document.getElementById('surfBar').innerHTML = surfBarHTML(); }
function swapSurface(s){ AIEB.setSurface(s); paintSurf(); renderNext(); }

function gateHTML(){
  return '<div class="sg-card">'+
    '<div class="eyebrow">One quick thing</div>'+
    '<h2>Where are you building?</h2>'+
    '<p>Pick where you run your AI Employee. You can switch anytime.</p>'+
    '<div class="sg-opts">'+
      '<button onclick="pickSurface(\'cowork\')"><b>Cowork</b><span>'+AIEB.SURFACES.cowork.blurb+'</span></button>'+
      '<button onclick="pickSurface(\'claude-code\')"><b>Claude Code</b><span>'+AIEB.SURFACES['claude-code'].blurb+'</span></button>'+
      '<button onclick="pickSurface(\'codex\')"><b>Codex</b><span>'+AIEB.SURFACES.codex.blurb+'</span></button>'+
    '</div></div>';

function pickSurface(s){ AIEB.setSurface(s); document.getElementById('gate').hidden = true; renderAll(); }
function maybeGate(){
  var g = document.getElementById('gate');
  if (!AIEB.getSurface()){ g.innerHTML = gateHTML(); g.hidden = false; }
  else { g.hidden = true; }
}

/* ---- OVERALL PROGRESS ---- */
function overallHTML(){
  var o = AIEB.overall();
  var label = o.complete ? 'Your AI Employee is built 🎉' : 'Progress to your AI Employee';
  var nextLine = o.complete
    ? 'All '+o.total+' steps complete.'
    : 'Step '+(o.done+1)+' of '+o.total+' on the way to a finished AI Employee';
  return '<div class="oprog-top"><span class="oprog-label">'+label+'</span><span class="oprog-pct">'+o.pct+'%</span></div>'+
    '<div class="oprog-bar"><div class="oprog-fill" style="width:'+o.pct+'%"></div></div>'+
    '<div class="oprog-next">'+nextLine+'</div>';
}

/* ---- WHAT TO WORK ON NEXT ---- */
// Take the checkpoint colour from BOARD, never from AIEB.META. progress.js still holds
// the original pastels ON PURPOSE: the checkpoint wizards use them as LIGHT ACCENTS with
// dark text (`.btn.primary{background:var(--cp);color:#0a0a0a}`), where a pastel is
// correct and darkening it would put dark text on a dark button. The board is the one
// place that paints those colours AS TEXT on paper, so it carries its own darker set.
var CPCOLOR = {};
BOARD.forEach(function (c) { CPCOLOR[c.id] = c.color; });

function nextbarHTML(){
  var id = AIEB.activeId(), m = AIEB.META[id], nc = CPCOLOR[id] || 'var(--accent)';
  // `goal` is a real checkpoint now, so only celebrate once it is actually DONE. While it is
  // merely ACTIVE it needs the normal banner with its own "start this checkpoint" button —
  // otherwise the last checkpoint has no way in.
  if (id==='goal' && AIEB.isDone('goal')){
    return '<div class="nextbar" style="--nc:#C2410C">'+
      '<div class="nb-main"><div class="nb-badge">🎉 You made it</div>'+
      '<div class="nb-title">Your AI Employee is built</div>'+
      '<div class="nb-lead">Every step is complete — reopen any checkpoint below to refine it.</div></div></div>';
  }
  var isSetup = id==='setup';
  var lead = isSetup ? 'Install your chosen app + the plugin and connect — one guided flow, about 30 minutes.' : (FOCUS_LEAD[id]||'');
  var badge = isSetup ? 'Start here · step 1' : ('Next up · checkpoint '+AIEB.buildIndex(id)+' of 5');
  var verb = isSetup ? 'Start setup' : (AIEB.stepInfo(id).pos>0 ? 'Continue' : 'Start this checkpoint');
  return '<div class="nextbar" style="--nc:'+nc+'">'+
    '<div class="nb-main"><div class="nb-badge">'+badge+'</div>'+
    '<div class="nb-title">'+m.name+'</div>'+
    '<div class="nb-lead">'+lead+'</div></div>'+
    '<a class="nb-go" href="'+(WIZARDS[id]||m.wizard)+'">'+verb+' →</a></div>';
}
function renderNext(){ document.getElementById('nextbar').innerHTML = nextbarHTML(); }

// The portal, offered as a resource library. Every one of these lands on a shell page,
// where the sidebar takes over and the whole portal is browsable — so this list is the
// door in, not a second copy of the nav. While there is still something to build it stays
// COLLAPSED behind one quiet line so it can't compete with the next action; once the
// journey is complete the board has no next action left, so the library becomes the offer.
var RES = [
  ['Business X-Ray',        'business-x-ray.html'],
  ['Skill Systems',         '../meta-create-skill/index.html'],
  ['Claude Code 101',       'claude-code-101.html'],
  ['Prompts & cheat sheet', 'prompts.html'],
  ['Skill Library',         'skill-library.html']
];
var resOpen = false;   // survives a re-render (progress sync repaints this rail)
function toggleRes(){
  resOpen = !resOpen;
  var el = document.getElementById('resMore');
  if (el) el.className = 'res-more' + (resOpen ? ' open' : '');
}
function resourcesHTML(){
  var links = RES.map(function(r){ return '<a href="'+r[1]+'">'+r[0]+'</a>'; }).join('');
  if (!AIEB.overall().complete)
    return '<div class="res"><div class="res-more'+(resOpen?' open':'')+'" id="resMore">'+
      '<button class="res-btn" onclick="toggleRes()">Browse the full portal <span class="car">▾</span></button>'+
      '<div class="res-panel"><div class="res-links">'+links+'</div></div></div></div>';
  return '<div class="res"><div class="res-card">'+
    '<h3>Your resource library</h3>'+
    '<p>The journey is done — everything below stays here for whenever you need it.</p>'+
    '<div class="res-links">'+links+'</div></div></div>';
}
function renderResources(){ document.getElementById('resources').innerHTML = resourcesHTML(); }

/* ---- THE FULL BOARD ---- */

// The cards actually on this board right now — the same surface filter the
// wizard applies to its own steps, so index N here is step N+1 there.
function activeCards(col){
  var surface = AIEB.getSurface();
  return col.cards.filter(function(c){ return !c.surface || c.surface === surface; });
}

/* Deep link into a checkpoint at a given card. `?step=N` is 1-based to match
   the "Step 3 of 6" the wizard prints — a URL a person may well read. */
function stepHref(id, i){
  var wiz = WIZARDS[id];
  if (!wiz) return null;
  if (i === null || i === undefined) return wiz;
  return wiz + (wiz.indexOf('?') > -1 ? '&' : '?') + 'step=' + (i + 1);
}

function cardHTML(col, card, status, i, interactive){
  var ty = TYPES[card.type] || TYPES.action;
  var href = interactive ? stepHref(col.id, col.summary ? null : i) : null;
  var tick = status === 'done' ? '&#10003;' : (status === 'doing' ? '&#9679;' : '');

  var h = '<li class="kcard is-'+status+(interactive?' is-live':'')+'">';
  // The tick is a real control on step columns and a plain marker on `setup`,
  // whose wizard keeps its own per-step state we must not fight over.
  if (interactive && !col.summary){
    var verb = status==='done' ? 'not done' : 'done';
    h += '<button type="button" class="ktick" aria-pressed="'+(status==='done')+'" '+
         'title="Mark '+verb+'" aria-label="Mark &quot;'+stripTags(card.t)+'&quot; '+verb+'" '+
         'onclick="toggleCard(event,\''+col.id+'\','+i+',\''+status+'\')">'+tick+'</button>';
  } else {
    h += '<span class="ktick static" aria-hidden="true">'+tick+'</span>';
  }

  var inner = '<span class="ktitle">'+card.t+'</span>'+
    '<span class="ktags"><span class="tag type">'+ty.ic+' '+ty.label+'</span>'+
    (card.optional ? '<span class="tag opt">Optional</span>' : '')+
    (STATUS[status] ? '<span class="tag st-'+status+'">'+STATUS[status]+'</span>' : '')+'</span>';

  h += href
    ? '<a class="kbody" href="'+href+'">'+inner+'<span class="kgo" aria-hidden="true">→</span></a>'
    : '<span class="kbody">'+inner+'</span>';
  return h + '</li>';
}

function stripTags(s){ return String(s).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;'); }

/* Card status now compares INDEXES rather than scaling a fraction. The old
   `Math.round(pos/total*n)` existed because the card list and the step list
   were different lengths; now that they are the same list, the honest answer is
   simply "everything before the saved position is done". */
function colStatuses(col, state, cards){
  var n = cards.length;
  if (state==='locked') return cards.map(function(){ return 'todo'; });
  if (state==='done')   return cards.map(function(){ return 'done'; });
  var info = col.summary ? AIEB.setupInfo() : AIEB.stepInfo(col.id);
  var pos = info.pos || 0;
  if (col.summary && info.total) pos = Math.round(pos / info.total * n);   // summary column scales
  pos = Math.max(0, Math.min(n - 1, pos));    // an active column always has one card in play
  return cards.map(function(c,i){ return i<pos ? 'done' : (i===pos ? 'doing' : 'todo'); });
}

function colHTML(col){
  var state = AIEB.stateOf(col.id), cards = activeCards(col);
  var statuses = colStatuses(col, state, cards);
  var stateLabel = state==='done' ? '✓ Done' : state==='active' ? '● Now' : '🔒 Locked';
  var wiz = WIZARDS[col.id], live = (state==='active' || state==='done') && !!wiz;
  /* MOBILE DEFAULT: exactly one column open — the one you are on. (Desktop
     ignores `open` entirely; the collapse only exists under 760px.) Opening
     every non-locked column meant a phone showed three finished checkpoints
     before the one being worked on, which is the opposite of what the board is
     for. Comparing against activeId rather than the state also covers the
     finished journey, where nothing is 'active' and the goal column is the
     right thing to land on. A column the reader opened by hand wins, and keeps
     winning through the repaints a progress sync triggers. */
  var open = colOpen.hasOwnProperty(col.id) ? colOpen[col.id] : (col.id === AIEB.activeId());
  var pillInner = '<span class="cdot"></span><span class="nm">'+col.name+'</span>';

  var h = '<div class="col '+state+(open?' open':'')+'" style="--cp:'+col.color+'" data-cp="'+col.id+'">';

  /* The whole header is the mobile expander. On desktop the columns are all
     open and this collapses nothing — it is a phone affordance that costs the
     desktop layout nothing, which is why it is one control rather than two. */
  h += '<button type="button" class="col-head" onclick="toggleCol(\''+col.id+'\')" '+
       'aria-expanded="'+open+'" aria-controls="body-'+col.id+'">';
  h += '<span class="col-pill">'+pillInner+'</span>';
  h += '<span class="col-state '+state+'">'+stateLabel+'</span>';
  h += '<span class="col-chev" aria-hidden="true">▾</span></button>';

  h += '<div class="col-body" id="body-'+col.id+'">';
  h += '<ul class="klist">'+cards.map(function(c,i){ return cardHTML(col, c, statuses[i], i, live); }).join('')+'</ul>';

  // Column footer — the way in, and the way back out of a finished checkpoint.
  h += '<div class="col-foot">';
  if (state==='locked'){
    h += '<span class="col-hint">Finish the checkpoint before it</span>';
  } else {
    var verb = state==='done' ? 'Review' : ((col.summary ? AIEB.setupInfo() : AIEB.stepInfo(col.id)).pos > 0 ? 'Continue' : 'Open');
    h += '<a class="col-go" href="'+stepHref(col.id, null)+'">'+verb+' →</a>';
    if (state==='done')
      h += '<button type="button" class="col-undo" onclick="undoCol(\''+col.id+'\')" '+
           'title="Reopen this checkpoint">↺ Reopen</button>';
  }
  h += '</div>';

  h += '</div></div>';
  return h;
}
function renderMap(){ document.getElementById('board').innerHTML = BOARD.map(colHTML).join(''); }

/* ---- INTERACTION: tick, untick, reopen ---------------------------------
   Every one of these routes through AIEB so the change is written once, pushed
   to the server once, and cascades the same way wherever it was triggered. */
function toggleCard(ev, id, i, status){
  ev.preventDefault(); ev.stopPropagation();
  // done → untick THIS card (and everything after it). Otherwise → complete up
  // to and including it, which is what a checklist tick means.
  AIEB.setStep(id, status==='done' ? i : i+1);
  renderAll();
}
function undoCol(id){
  var m = AIEB.META[id];
  if (!confirm('Reopen “'+m.name+'”?\n\nIt goes back to in-progress, and every checkpoint after it re-locks. Nothing you built is deleted.')) return;
  AIEB.unmarkDone(id);
  renderAll();
}

/* Mobile only. The class is toggled on the live node instead of re-rendering,
   so opening a column can't be undone by the next progress sync repaint. */
var colOpen = {};
function toggleCol(id){
  var el = document.querySelector('.col[data-cp="'+id+'"]');
  if (!el) return;
  var nowOpen = !el.classList.contains('open');
  el.classList.toggle('open', nowOpen);
  colOpen[id] = nowOpen;
  var head = el.querySelector('.col-head');
  if (head) head.setAttribute('aria-expanded', String(nowOpen));
}

/* ---- RESET / RESTORE ---------------------------------------------------
   Built for running a live walkthrough on a real account: wipe the board back
   to a brand-new buyer, demo the journey, then put the real state back. The
   restore is the half that makes the reset safe to offer at all — nothing here
   touches what was actually BUILT, only what the board shows. */
function resetProgress(){
  if (!confirm('Reset the whole board?\n\nEvery checkpoint goes back to not-started, as if you just bought. Nothing you built is deleted — "Restore my real progress" brings the board back.')) return;
  AIEB.resetAll();
  colOpen = {};
  renderAll();
}
function restoreProgress(){
  AIEB.restoreVerified().then(renderAll);
}
function adminHTML(){
  var muted = AIEB.hasSuppressed();
  return '<div class="admin'+(muted?' muted':'')+'">'+
    (muted
      ? '<span class="admin-note">This board is showing reset/reopened progress. Your verified build history is untouched.</span>'
      : '')+
    '<div class="admin-row">'+
      '<button type="button" class="admin-btn" onclick="resetProgress()">↺ Reset all progress</button>'+
      (muted ? '<button type="button" class="admin-btn primary" onclick="restoreProgress()">Restore my real progress</button>' : '')+
    '</div></div>';
}
function renderAdmin(){ document.getElementById('admin').innerHTML = adminHTML(); }

/* ── SIGN IN ───────────────────────────────────────────────────────────────
   Why this is here at all: progress used to live only in this browser, and
   WebKit deletes localStorage after 7 days of Safari use without interaction on
   the site. Signing in moves the durable copy to the server, keyed to the
   person, behind a first-party cookie the purge exempts.

   The honesty rule this enforces: when the board can identify NOBODY and this
   browser holds NOTHING, it must not confidently announce "Start here · step 1"
   — a buyer four checkpoints in would read that as having lost their work. In
   that one state we lead with the sign-in prompt instead. Every other state
   renders exactly as before, and someone who never signs in keeps the old
   local-only behaviour untouched. */
var GOOGLE_CLIENT_ID = '969669674527-l2s0bluvsnroh5ftvd6s8fuv1h4e9gea.apps.googleusercontent.com';
var gsiReady = false;

/* checking | in | out | local.

   `checking` — the session lives in an HttpOnly cookie the page cannot read, so
     only the server can answer. Guessing "out" flashes a sign-in screen at
     someone already signed in; guessing "in" shows a ladder to a stranger.

   `local` — we could not reach the server AND this browser holds real progress.
     Show the board from local storage. This page is public with nothing secret
     behind it, so hiding a working board because an auth service is unreachable
     is a self-inflicted outage: offline, an ad-blocker, a corporate proxy, or a
     Vercel blip would each blank a board whose state is sitting right there.

   Only an AFFIRMATIVE "you are not signed in" shows the wall. */
var authState = 'checking';

function resolveAuthState(){
  var s = AIEB.sessionState();
  if (s === 'in') return 'in';
  if (s === 'out') return 'out';
  return AIEB.started() ? 'local' : 'out';   // unknown: fall back, don't lock out
}

function renderAuth(){
  var boardVisible = authState === 'in' || authState === 'local';
  document.getElementById('checkingview').hidden = authState !== 'checking';
  document.getElementById('signinview').hidden  = authState !== 'out';
  document.getElementById('boardview').hidden   = !boardVisible;

  var who = document.getElementById('whoami');
  if (authState === 'in') {
    who.hidden = false;
    who.innerHTML = '<span>' + (maskedAccount() || 'Signed in') + '</span>'
                  + '<button type="button" class="auth-link" onclick="doSignOut()">Sign out</button>';
  } else if (authState === 'local') {
    // Honest about what it is: their work is here, just not backed up yet.
    who.hidden = false;
    who.innerHTML = '<span>Showing this device only</span>'
                  + '<button type="button" class="auth-link" onclick="retrySignIn()">Sign in</button>';
  } else {
    who.hidden = true;
  }

  if (authState === 'out') mountGoogleButton();
}

// Dismissing Google's prompt used to leave the board hidden until a manual
// reload: this pinned authState to 'out' and nothing ever moved it back, so the
// local board the buyer was just looking at vanished behind a sign-in screen
// they had already declined. Re-derive instead, so declining returns them to
// exactly where they were.
function retrySignIn(){
  authState = 'out';
  renderAll();
  setTimeout(function(){
    if (authState === 'out' && !AIEB.isSignedIn()) { authState = resolveAuthState(); renderAll(); }
  }, 30000);
}

/* An account we cannot match to a purchase. The server has always sent `linked`
   and nothing read it, so this buyer saw an empty board and a confident
   "Start here · step 1" — a statement about their progress, made from an
   identity we could not tie to anything they own. Usually it just means they
   bought on a work address and signed in with a personal one. */
function renderLinkNote(){
  var slot = document.getElementById('linknote');
  if (!slot) return;
  var show = authState === 'in' && AIEB.linked() === false && !AIEB.started();
  slot.hidden = !show;
  if (show) {
    slot.innerHTML = '<strong>We can\'t match this Google account to a purchase.</strong> '
      + 'If you bought with a different email address, sign out and sign back in with that one — '
      + 'your progress is saved against it. If this IS the right address, nothing is lost: '
      + 'carry on and your work saves here.';
  }
}

// Shown so a beginner can tell it worked, and so signing in as the wrong Google
// account is visible instead of silent. Kept client-side on purpose: the server
// stores only a hash of the address, and this is the one place we want the
// human-readable form — in front of the person it belongs to.
function maskedAccount(){
  var raw = AIEB.account();
  var at = raw ? raw.indexOf('@') : -1;
  return at > 0 ? 'Saved to ' + raw[0] + '••••' + raw.slice(at) : '';
}

function mountGoogleButton(){
  var slot = document.getElementById('gbtn');
  if (!slot || !window.google || !google.accounts || !google.accounts.id) return;
  if (!gsiReady) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: onGoogleCredential,
      // FedCM is where Google Identity Services is heading and the legacy path
      // is being retired; opting in keeps this working as that lands.
      use_fedcm_for_prompt: true
    });
    gsiReady = true;
  }
  google.accounts.id.renderButton(slot, {
    theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', logo_alignment: 'left'
  });
}

function onGoogleCredential(response){
  if (!response || !response.credential) return;
  AIEB.signInWithGoogle(response.credential).then(function(){
    // Trust the round-trip, not the POST's status code. If the cookie was not
    // actually stored — blocked outright, a wrong cookie domain — the server
    // still answers "not signed in" on the follow-up, and rendering the board
    // with a "Saved to…" chip would be a lie: every later write is dropped.
    authState = resolveAuthState();
    if (authState !== 'in') document.getElementById('signinerr').hidden = false;
    renderAll();
  });
}

function doSignOut(){
  // Stop Google from silently re-authenticating on the next paint; without this
  // "sign out" bounces straight back to signed in and looks broken.
  try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}
  AIEB.signOut().then(function(){ authState = 'out'; renderAll(); });
}

// The GIS script is async, so it can land before or after the first paint.
// Poll briefly rather than racing it — the button is the only thing waiting.
(function waitForGsi(tries){
  if (window.google && google.accounts && google.accounts.id) { renderAuth(); return; }
  if (tries > 40) return;
  setTimeout(function(){ waitForGsi(tries + 1); }, 150);
})(0);

function renderAll(){
  renderAuth();
  // Everything below draws the board, so skip it entirely unless the board is
  // the visible view — rendering a ladder into a hidden node is wasted work at
  // best, and one refactor away from leaking it into the sign-in screen.
  //
  // This MUST match renderAuth's `boardVisible` exactly. It used to read
  // `!== 'in'`, which un-hid the board container for `local` and then never
  // populated it: #oprog / #nextbar / #board / #resources are empty in the
  // markup and this is their only writer. So the fallback state added to
  // survive an auth outage rendered a page with a header, "Showing this device
  // only", and nothing else — strictly worse than the wall it replaced,
  // because the work looked deleted rather than merely hidden.
  if (authState !== 'in' && authState !== 'local') return;
  maybeGate();
  paintSurf();
  document.getElementById('oprog').innerHTML = overallHTML();
  renderLinkNote();
  renderResources();
  renderNext();
  renderMap();
  renderAdmin();
}
renderAll();

// progress.js answers two different questions on load — "whose board is this"
// (the session) and "what did they actually build" (the view-token ladder) —
// and fires this when either lands. Re-deriving authState here rather than
// trusting a local flag keeps the view honest if a session expired server-side.
window.addEventListener('aieb:progress-synced', function(){
  authState = resolveAuthState();
  renderAll();
});
</script>
<script src="session-chip.js" defer></script>
</body>
</html>
