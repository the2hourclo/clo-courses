<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to AI Employee Builders</title>
<link rel="stylesheet" href="../clo-course/excalifont.css">
<!-- ═══════════════════════════════════════════════════════════════════════════
     POST-PURCHASE WELCOME. Lemon Squeezy redirects buyers straight here as
     ?license_key=… (see product/activate/index.html) — this is the FIRST page a
     paying buyer sees, so it carries the key into localStorage and hands off.

     WHITE-EXCALI SKIN (2026-07-25). It was the last page left on the retired dark
     skin (#0d0d0d + the old lime #79EA20) while the whole portal had moved to
     paper/ink/green, so the moment of paying was also the moment the brand changed
     under you. Same tokens as clo-course/index.html.

     IT NO LONGER RE-TEACHES ONBOARDING. It used to list three steps — join the
     community, open the wiki, install on Claude Code. Those are the SAME three
     actions as the board's "Get set up" checkpoint, except done here they tick
     nothing: progress lives in `aieb_progress`, which only the board and the
     wizards write. A buyer could finish all three and still be told "Get set up —
     0%". One journey, one place that counts it. This page now welcomes, hands over
     the key, and points at the portal; the board drives the actual setup.
     ═══════════════════════════════════════════════════════════════════════════ -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FAFAFA; --ink:#21211E; --body:#3D3D38; --soft:#6B6B63;
  --green:#2D8C3C; --green-soft:#EAF4EC; --card:#FFFFFF; --rule:#E2E2DC;
  --red:#B3261E; --red-soft:#FBEAE9;
  --sketch:255px 15px 225px 15px/15px 225px 15px 255px;
  --excali:'Excalifont',system-ui,sans-serif;
  --mono:'SF Mono','Monaco','Consolas',monospace;
}
html{background:var(--paper);color:var(--body);font:17px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:44px 22px 64px}
.container{max-width:620px;margin:0 auto}
@media(max-width:640px){body{padding:30px 16px 48px}}

/* ── BRAND ── */
.brand-header{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:34px}
.brand-logo{width:44px;height:44px;display:block}
.brand-name{font-family:var(--excali);font-size:17px;color:var(--ink)}

/* ── INTRO ── */
.intro{text-align:center;margin-bottom:30px}
.eyebrow{font-family:var(--excali);color:var(--green);font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.intro h1{font-size:clamp(28px,5vw,40px);line-height:1.12;font-weight:700;color:var(--ink);margin-bottom:14px;text-wrap:balance}
.intro .lead{font-size:16.5px;color:var(--body);max-width:470px;margin:0 auto}

/* ── LICENSE TICKET ── */
.ticket{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--ink);border-radius:15px 4px 15px 4px;box-shadow:3px 4px 0 rgba(33,33,30,.08);padding:17px 19px;margin-bottom:26px;flex-wrap:wrap}
.ticket-body{flex:1;min-width:190px}
.ticket-label{font-family:var(--excali);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:5px}
.ticket-key{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink);word-break:break-all;line-height:1.45}
.ticket-note{font-size:13px;color:var(--soft);margin-top:6px}
.copy-btn{flex-shrink:0;font-family:inherit;font-size:13px;font-weight:600;padding:10px 17px;border:1.5px solid var(--ink);border-radius:12px 3px 12px 3px;background:var(--card);color:var(--ink);cursor:pointer;transition:transform .13s,box-shadow .13s,background .13s}
.copy-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 4px 0 rgba(33,33,30,.12)}
.copy-btn.copied{background:var(--green);border-color:var(--green);color:#fff}
@media(max-width:560px){.ticket{flex-direction:column;align-items:stretch}.copy-btn{width:100%}}

/* ── PRIMARY CTA ── */
.go{text-align:center;margin-bottom:14px}
.cta{display:inline-flex;align-items:center;gap:9px;background:var(--green);color:#fff;text-decoration:none;border:2px solid var(--ink);border-radius:var(--sketch);padding:16px 44px;font-family:var(--excali);font-size:21px;box-shadow:3px 4px 0 rgba(33,33,30,.55);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 rgba(33,33,30,.55);color:#fff}
.cta:active{transform:translateY(1px);box-shadow:2px 2px 0 rgba(33,33,30,.55)}
.go-sub{font-size:14px;color:var(--soft);margin-top:13px}

/* ── WHAT HAPPENS NEXT ── */
.next{background:var(--card);border:2px solid var(--ink);border-radius:15px 4px 15px 4px;box-shadow:3px 4px 0 rgba(33,33,30,.08);padding:24px 26px;margin:30px 0 24px}
.next h2{font-family:var(--excali);font-size:19px;color:var(--ink);margin-bottom:14px;font-weight:400}
.next p{font-size:15px;color:var(--body);margin-bottom:13px;line-height:1.65}
.next p:last-child{margin-bottom:0}
.next strong{color:var(--ink);font-weight:700}

/* ── COMMUNITY (quiet secondary) ── */
.pn{display:flex;align-items:center;gap:13px;border:1.5px dashed var(--rule);border-radius:12px 4px 12px 4px;padding:14px 16px;text-decoration:none;color:inherit;transition:all .14s}
.pn:hover{border-color:var(--green);border-style:solid;background:var(--green-soft)}
.pn-logo{width:38px;height:38px;flex-shrink:0}
.pn-text{flex:1;min-width:0}
.pn-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.25}
.pn-desc{font-size:13px;color:var(--soft);margin-top:2px}
.pn-go{font-family:var(--excali);font-size:15px;color:var(--green);flex-shrink:0}

/* ── FOOTER ── */
.footer{text-align:center;margin-top:38px;padding-top:22px;border-top:1.5px solid var(--rule);font-size:13.5px;color:var(--soft)}
.footer a{color:var(--green);font-weight:600;text-decoration:none}
.footer a:hover{text-decoration:underline}
.footer-logout{margin-left:12px;cursor:pointer;color:var(--soft);background:none;border:none;font-size:13.5px;text-decoration:underline;font-family:inherit}
.footer-logout:hover{color:var(--ink)}

/* ── LOCK / EXPIRED ── */
.lock{max-width:440px;margin:0 auto;text-align:center}
.lock-icon{font-size:42px;margin-bottom:14px;line-height:1}
.lock h1{font-size:27px;font-weight:700;color:var(--ink);margin-bottom:12px;line-height:1.15}
.lock .lead{color:var(--body);font-size:16px;margin-bottom:26px}
.lock-form{background:var(--card);border:2px solid var(--ink);border-radius:15px 4px 15px 4px;box-shadow:3px 4px 0 rgba(33,33,30,.08);padding:22px;margin-bottom:16px;text-align:left}
.lock-form label{display:block;font-family:var(--excali);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.lock-form input{width:100%;padding:12px 14px;border:1.5px solid var(--ink);border-radius:10px 3px 10px 3px;font-size:14px;font-family:var(--mono);color:var(--ink);background:var(--paper);outline:none;transition:border-color .2s,box-shadow .2s}
.lock-form input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.lock-form input::placeholder{color:#A8A89E}
.lock-form button{width:100%;margin-top:13px;padding:14px;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:var(--sketch);font-family:var(--excali);font-size:18px;cursor:pointer;box-shadow:3px 4px 0 rgba(33,33,30,.45);transition:transform .14s,box-shadow .14s}
.lock-form button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 5px 0 rgba(33,33,30,.45)}
.lock-form button:disabled{opacity:.45;cursor:not-allowed}
.lock-error{background:var(--red-soft);border:1.5px solid var(--red);color:var(--red);padding:10px 14px;border-radius:10px 3px 10px 3px;font-size:13.5px;margin-top:13px;display:none}
.lock-error.show{display:block}
.lock-hint{font-size:13.5px;color:var(--soft);margin-top:13px}
.lock-hint a{color:var(--green);font-weight:600;text-decoration:none}
.lock-hint a:hover{text-decoration:underline}

/* ── LOADING ── */
.loading-screen{text-align:center;padding:120px 30px;color:var(--soft)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--rule);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ENTRANCE ── */
.rise{opacity:0;transform:translateY(14px);animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*.08s)}
@keyframes rise{to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="container" id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div>Verifying your access…</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════
const PRODUCT = {
  name: 'AI Employee Builders',
  store_id: 10600,
  product_id: 926993,
  variant_id: 1457440,
  checkout_url: 'https://chiefleverageofficer.lemonsqueezy.com/checkout/buy/14c15890-c46a-4ab8-ab8d-9e56cd04d38a',
  skillstack_slug: 'clo-community'
};
const STORAGE_KEY = 'clo_community_license';

// ONE product since 2026-07-25 — the ?product=aieb switch that used to pick between
// the CLO and AIEB communities is gone. Everything is AI Employee Builders now.
const COMMUNITY = { name: 'AI Employee Builders', handle: 'c/ai-employee-builders', url: 'https://www.polynet.ai/c/ai-employee-builders' };
const BRAND_LOGO = '../clo-course/assets/aieb-avatar-180.png';
const BRAND_ALT = 'AI Employee Builder';
const WELCOME_NAME = 'AI Employee Builders';
// Build portal links that carry the real license key ONLY when we actually have one
// (never the temp-open placeholder).
function wikiHref(key, hash){
  const q = key ? '?license_key=' + encodeURIComponent(key) : '';
  return '../clo-course/' + q + (hash || '');
}

// ══════════════════════════════════════════════════════
// INIT — runs on every page load
// ══════════════════════════════════════════════════════
const app = document.getElementById('app');

(async function init() {
  const urlParams = new URLSearchParams(window.location.search);
  let licenseKey = urlParams.get('license_key');

  // TEMP 2026-05-28: license gate disabled — change `true` back to `urlParams.get('preview') === 'YES'` to re-enable.
  // Pass the real key through if the invite link carries one; otherwise render with no key (no fake placeholder).
  if (true) {
    // Lemon Squeezy redirects buyers here as ?license_key=… . The scrub below used to
    // live after the (now unreachable) validation block, so with the gate open the key
    // sat in the address bar and browser history permanently. Scrub it unconditionally.
    if (urlParams.has('license_key')) {
      try {
        localStorage.setItem(STORAGE_KEY, licenseKey);
        urlParams.delete('license_key');
        const rest = urlParams.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      } catch (e) {}
    }
    return renderUnlocked(licenseKey || localStorage.getItem(STORAGE_KEY) || '');
  }

  if (!licenseKey) {
    licenseKey = localStorage.getItem(STORAGE_KEY);
  }

  if (!licenseKey) {
    return renderLocked();
  }

  const result = await validateLicense(licenseKey);

  if (!result.ok) {
    localStorage.removeItem(STORAGE_KEY);
    if (result.reason === 'expired') {
      return renderExpired();
    }
    return renderLocked(result.message);
  }

  localStorage.setItem(STORAGE_KEY, licenseKey);
  if (urlParams.has('license_key')) {
    history.replaceState(null, '', window.location.pathname);
  }
  renderUnlocked(licenseKey);
})();

// ══════════════════════════════════════════════════════
// LICENSE VALIDATION
// ══════════════════════════════════════════════════════
async function validateLicense(licenseKey) {
  try {
    const res = await fetch('https://api.lemonsqueezy.com/v1/licenses/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ license_key: licenseKey })
    });
    const data = await res.json();

    if (!data.valid) {
      const status = data.license_key?.status;
      if (status === 'expired' || status === 'disabled' || status === 'inactive') {
        return { ok: false, reason: 'expired' };
      }
      return { ok: false, reason: 'invalid', message: data.error || 'Invalid license key.' };
    }

    if (data.meta?.store_id !== PRODUCT.store_id || data.meta?.product_id !== PRODUCT.product_id) {
      return { ok: false, reason: 'wrong_product', message: 'This license is for a different product.' };
    }

    if (PRODUCT.variant_id && data.meta?.variant_id !== PRODUCT.variant_id) {
      return { ok: false, reason: 'wrong_variant', message: 'This license is for a different subscription tier.' };
    }

    if (data.license_key?.status && data.license_key.status !== 'active') {
      return { ok: false, reason: 'expired' };
    }

    return { ok: true, meta: data.meta, license_key: data.license_key };
  } catch (err) {
    return { ok: false, reason: 'network', message: 'Could not reach the license server. Check your connection and try again.' };
  }
}

// ══════════════════════════════════════════════════════
// SHARED CHROME
// ══════════════════════════════════════════════════════
function brandHeader() {
  return `<div class="brand-header rise">
      <img class="brand-logo" src="${BRAND_LOGO}" alt="${BRAND_ALT}">
      <span class="brand-name">AI Employee Builder</span>
    </div>`;
}
function supportFooter(withSignOut) {
  return `<div class="footer">
      Questions? Email <a href="mailto:rashid@thepeakperformer.io">rashid@thepeakperformer.io</a>
      ${withSignOut ? '<button class="footer-logout" onclick="signOut()">Sign out</button>' : ''}
    </div>`;
}

// ══════════════════════════════════════════════════════
// LOCKED STATE
// ══════════════════════════════════════════════════════
function renderLocked(errorMessage) {
  app.innerHTML = `
    ${brandHeader()}
    <div class="lock rise" style="--i:1">
      <div class="lock-icon">🔒</div>
      <h1>AI Employee Builders</h1>
      <p class="lead">Enter your license key to unlock your build portal.</p>

      <form class="lock-form" id="unlockForm">
        <label for="licenseInput">License key</label>
        <input type="text" id="licenseInput" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" required autofocus>
        <button type="submit" id="unlockBtn">Unlock →</button>
        <div class="lock-error ${errorMessage ? 'show' : ''}" id="lockError">${errorMessage || ''}</div>
      </form>

      <div class="lock-hint">Find your license key in your purchase confirmation email.</div>
      <div class="lock-hint">No license yet? <a href="${PRODUCT.checkout_url}" target="_blank" rel="noopener">Join the community →</a></div>
    </div>
    ${supportFooter(false)}
  `;
  document.getElementById('unlockForm').addEventListener('submit', handleUnlock);
}

async function handleUnlock(e) {
  e.preventDefault();
  const licenseKey = document.getElementById('licenseInput').value.trim();
  const errorEl = document.getElementById('lockError');
  const btn = document.getElementById('unlockBtn');
  if (!licenseKey) return;

  btn.disabled = true;
  btn.textContent = 'Verifying…';
  errorEl.classList.remove('show');

  const result = await validateLicense(licenseKey);

  if (!result.ok) {
    btn.disabled = false;
    btn.textContent = 'Unlock →';
    errorEl.textContent = result.reason === 'expired'
      ? 'This license has expired. Renew your subscription to regain access.'
      : (result.message || 'Could not verify license. Check the key and try again.');
    errorEl.classList.add('show');
    return;
  }

  localStorage.setItem(STORAGE_KEY, licenseKey);
  renderUnlocked(licenseKey);
}

// ══════════════════════════════════════════════════════
// EXPIRED STATE
// ══════════════════════════════════════════════════════
function renderExpired() {
  app.innerHTML = `
    ${brandHeader()}
    <div class="lock rise" style="--i:1">
      <div class="lock-icon">⏱</div>
      <h1>Your subscription has ended</h1>
      <p class="lead">This license is no longer active. Renew to get back your portal, the community, and your skills in Claude.</p>
      <div class="go"><a href="${PRODUCT.checkout_url}" target="_blank" rel="noopener" class="cta">Renew subscription →</a></div>
      <div class="lock-hint" style="margin-top:26px">Already renewed? <button class="footer-logout" style="margin-left:0" onclick="location.reload()">Reload page</button></div>
    </div>
    ${supportFooter(false)}
  `;
}

// ══════════════════════════════════════════════════════
// UNLOCKED STATE — welcome, hand over the key, hand off to the portal.
// Setup itself is NOT taught here; the board owns it and counts it.
// ══════════════════════════════════════════════════════
function renderUnlocked(licenseKey) {
  const ticket = licenseKey ? `
    <div class="ticket rise" style="--i:2">
      <div class="ticket-body">
        <div class="ticket-label">Your license key</div>
        <div class="ticket-key" id="licenseKeyText">${licenseKey}</div>
        <div class="ticket-note">Saved in this browser. Setup will ask you to paste it — it's in your purchase email too.</div>
      </div>
      <button class="copy-btn" data-copy-target="licenseKeyText">Copy key</button>
    </div>` : '';

  app.innerHTML = `
    ${brandHeader()}

    <div class="intro rise" style="--i:1">
      <div class="eyebrow">You're in</div>
      <h1>Welcome to ${WELCOME_NAME}.</h1>
      <p class="lead">Your portal is open. It walks you from nothing installed to a working AI Employee, one step at a time — and it always shows you the single next thing to do.</p>
    </div>

    ${ticket}

    <div class="go rise" style="--i:3">
      <a class="cta" href="${wikiHref(licenseKey)}">Start building →</a>
      <div class="go-sub">First stop: getting Claude set up. About 30 minutes.</div>
    </div>

    <div class="next rise" style="--i:4">
      <h2>What happens in there</h2>
      <p>You'll get Claude installed and connected, then run your <strong>Business X-Ray</strong> — a guided audit that maps how your business actually runs and finds the one job worth handing off first. You just answer its questions.</p>
      <p>From there you turn that job into a skill, chain a few skills into a system, and put it on a schedule. That's the AI Employee. The board tracks where you are, so you can stop mid-way and pick up exactly where you left off.</p>
    </div>

    <a class="pn rise" style="--i:5" href="${COMMUNITY.url}" target="_blank" rel="noopener">
      <img class="pn-logo" src="${BRAND_LOGO}" alt="">
      <div class="pn-text">
        <div class="pn-name">${COMMUNITY.name}</div>
        <div class="pn-desc">Say hello, and ask anything as you build · ${COMMUNITY.handle}</div>
      </div>
      <span class="pn-go">Enter ↗</span>
    </a>

    ${supportFooter(true)}
  `;
  wireCopyButtons();
}

// ══════════════════════════════════════════════════════
// SHARED UTILITIES
// ══════════════════════════════════════════════════════
function wireCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.copyTarget;
      if (!target) return;
      const el = document.getElementById(target);
      if (!el) return;
      navigator.clipboard.writeText(el.textContent.trim()).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1400);
      });
    });
  });
}

function signOut() {
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}
</script>
