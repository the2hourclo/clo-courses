<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<!-- v2-06 · rebuilt 2026-09-23 (shown in CP3 BEFORE 05): two lead skills (weekly-email/, launch-email/) both call
     the SAME shared skills draft-email/ + qa-draft/; draft-email/'s own workflows serve only draft-email/.
     Shared-skill cards grey/ink, workflow files green; labels by role (DESIGN-SYSTEM §8, §10, §11). -->
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) — NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- ===== LEFT · lead skill: weekly-email/ ===== -->

  <rect x="70" y="315" width="16" height="7" rx="2" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="70" y="321" width="36" height="25" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>

  <!-- ===== RIGHT · lead skill: launch-email/ ===== -->

  <rect x="1160" y="321" width="36" height="25" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <line x1="1150" y1="368" x2="1540" y2="368" stroke="rgb(224,224,222)" stroke-width="2"/>

  <!-- ===== CENTER · shared skill: draft-email/ (grey card) ===== -->
  <rect x="580" y="170" width="440" height="440" rx="18" stroke="var(--ink)" stroke-width="4" fill="rgba(0,0,0,0.045)"/>

  <circle cx="642" cy="379" r="2.6" fill="var(--green)" stroke="none"/>

  <line x1="598" y1="798" x2="1002" y2="798" stroke="rgb(212,212,210)" stroke-width="2"/>

  <!-- ===== calls: both lead skills reach the SAME two shared skills ===== -->
  <path d="M472,557 C532,557 526,325 572,325" stroke="var(--ink)" stroke-width="3.5"/>
  <polyline points="564,317 578,325 564,333" stroke="var(--ink)" stroke-width="3.5"/>
  <path d="M472,609 C530,609 526,775 572,775" stroke="var(--ink)" stroke-width="3.5"/>
  <polyline points="564,767 578,775 564,783" stroke="var(--ink)" stroke-width="3.5"/>

  <polyline points="1036,767 1022,775 1036,783" stroke="var(--ink)" stroke-width="3.5"/>

  <!-- ===== legend swatches ===== -->
  <rect x="560" y="920" width="56" height="34" rx="8" stroke="var(--ink)" stroke-width="3" fill="rgba(0,0,0,0.045)"/>
  <rect x="560" y="972" width="56" height="34" rx="8" stroke="var(--green)" stroke-width="3" fill="rgba(45,140,60,0.07)"/>
</g>
