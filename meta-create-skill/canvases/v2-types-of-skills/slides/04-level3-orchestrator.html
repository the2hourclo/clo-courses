<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --frame:rgb(190,190,188);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<!-- v2-04 · rebuilt 2026-09-23: Level 3 as a PLANT only (v4 owns the detail) on the Weekly Email example.
     weekly-email/ = the lead skill; it runs pull-stats/ -> what-worked/ -> draft-email/ -> qa-draft/; you review.
     One metaphor (the lead skill). No folder legend, no per-step folder chips (DESIGN-SYSTEM §8-§11). -->
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) — NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- the skill system boundary (faint dashed) -->
  <rect x="50" y="200" width="1240" height="680" rx="28" stroke="var(--frame)" stroke-width="2.5" stroke-dasharray="12 12"/>

  <!-- the lead skill -->
  <rect x="455" y="230" width="430" height="150" rx="18" stroke="var(--ink)" stroke-width="5" fill="var(--bg)"/>
  <rect x="487" y="269" width="22" height="9" rx="3" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="487" y="277" width="52" height="36" rx="4" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>

  <!-- it runs all four: rail + drops -->
  <line x1="670" y1="382" x2="670" y2="432" stroke="var(--ink)" stroke-width="3.5"/>
  <line x1="190" y1="432" x2="1150" y2="432" stroke="var(--ink)" stroke-width="3.5"/>
  <line x1="190"  y1="432" x2="190"  y2="472" stroke="var(--ink)" stroke-width="3.5"/>
  <polyline points="182,464 190,477 198,464" stroke="var(--ink)" stroke-width="3.5"/>
  <line x1="510"  y1="432" x2="510"  y2="472" stroke="var(--ink)" stroke-width="3.5"/>
  <polyline points="502,464 510,477 518,464" stroke="var(--ink)" stroke-width="3.5"/>
  <line x1="830"  y1="432" x2="830"  y2="472" stroke="var(--ink)" stroke-width="3.5"/>
  <polyline points="822,464 830,477 838,464" stroke="var(--ink)" stroke-width="3.5"/>
  <line x1="1150" y1="432" x2="1150" y2="472" stroke="var(--ink)" stroke-width="3.5"/>
  <polyline points="1142,464 1150,477 1158,464" stroke="var(--ink)" stroke-width="3.5"/>

  <!-- the four steps, each its own skill -->
  <rect x="90"   y="480" width="200" height="180" rx="16" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <rect x="410"  y="480" width="200" height="180" rx="16" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <rect x="730"  y="480" width="200" height="180" rx="16" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <rect x="1050" y="480" width="200" height="180" rx="16" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <!-- folder icons -->
  <rect x="155"  y="559" width="24" height="9" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="155"  y="567" width="70" height="48" rx="5" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="475"  y="559" width="24" height="9" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="475"  y="567" width="70" height="48" rx="5" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="795"  y="559" width="24" height="9" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="795"  y="567" width="70" height="48" rx="5" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="1115" y="559" width="24" height="9" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="1115" y="567" width="70" height="48" rx="5" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>

  <!-- in order: each hands to the next -->
  <line x1="292" y1="590" x2="400" y2="590" stroke="var(--ink)" stroke-width="4"/>
  <polyline points="390,581 404,590 390,599" stroke="var(--ink)" stroke-width="4"/>
  <line x1="612" y1="590" x2="720" y2="590" stroke="var(--ink)" stroke-width="4"/>
  <polyline points="710,581 724,590 710,599" stroke="var(--ink)" stroke-width="4"/>
  <line x1="932" y1="590" x2="1040" y2="590" stroke="var(--ink)" stroke-width="4"/>
  <polyline points="1030,581 1044,590 1030,599" stroke="var(--ink)" stroke-width="4"/>
  <!-- the draft goes to you -->
  <line x1="1252" y1="590" x2="1384" y2="590" stroke="var(--ink)" stroke-width="4"/>
  <polyline points="1374,581 1388,590 1374,599" stroke="var(--ink)" stroke-width="4"/>

  <!-- you (ink stick figure) -->
  <circle cx="1440" cy="526" r="26" stroke="var(--ink)" stroke-width="4.5" fill="var(--bg)"/>
  <line x1="1440" y1="552" x2="1440" y2="632" stroke="var(--ink)" stroke-width="4.5"/>
  <line x1="1440" y1="576" x2="1408" y2="610" stroke="var(--ink)" stroke-width="4.5"/>
  <line x1="1440" y1="576" x2="1472" y2="610" stroke="var(--ink)" stroke-width="4.5"/>
  <line x1="1440" y1="632" x2="1414" y2="680" stroke="var(--ink)" stroke-width="4.5"/>
  <line x1="1440" y1="632" x2="1466" y2="680" stroke="var(--ink)" stroke-width="4.5"/>
</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<text x="800" y="86" font-size="60" font-weight="700" text-anchor="middle" fill="var(--ink)">One Skill Runs the Others, In Order</text>

<!-- lead skill -->
<text class="mono" x="559" y="305" font-size="34" font-weight="700" fill="var(--ink)">weekly-email/</text>
<text x="559" y="352" font-size="28" font-weight="700" fill="var(--ink)">the lead skill</text>

<!-- steps -->
<text x="190"  y="524" font-size="26" text-anchor="middle" fill="var(--dim)">STEP 1</text>
<text x="510"  y="524" font-size="26" text-anchor="middle" fill="var(--dim)">STEP 2</text>
<text x="830"  y="524" font-size="26" text-anchor="middle" fill="var(--dim)">STEP 3</text>
<text x="1150" y="524" font-size="26" text-anchor="middle" fill="var(--dim)">STEP 4</text>

<text class="mono" x="190"  y="712" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">pull-stats/</text>
<text x="190"  y="750" font-size="26" text-anchor="middle" fill="var(--dim)">gets last</text>
<text x="190"  y="782" font-size="26" text-anchor="middle" fill="var(--dim)">week&#8217;s numbers</text>

<text class="mono" x="510"  y="712" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">what-worked/</text>
<text x="510"  y="750" font-size="26" text-anchor="middle" fill="var(--dim)">finds the</text>
<text x="510"  y="782" font-size="26" text-anchor="middle" fill="var(--dim)">winners</text>

<text class="mono" x="830"  y="712" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">draft-email/</text>
<text x="830"  y="750" font-size="26" text-anchor="middle" fill="var(--dim)">writes this</text>
<text x="830"  y="782" font-size="26" text-anchor="middle" fill="var(--dim)">week&#8217;s email</text>
<text x="830"  y="814" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">&#8593;</text>
<text x="830"  y="846" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">you build this one first</text>

<text class="mono" x="1150" y="712" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">qa-draft/</text>
<text x="1150" y="750" font-size="26" text-anchor="middle" fill="var(--dim)">checks it against</text>
<text x="1150" y="782" font-size="26" text-anchor="middle" fill="var(--dim)">your rules</text>

<!-- you -->
<text x="1440" y="724" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">you</text>
<text x="1440" y="760" font-size="26" text-anchor="middle" fill="var(--dim)">review the draft</text>

<!-- caption tying it forward -->
<text x="800" y="948" font-size="38" font-weight="700" text-anchor="middle" fill="var(--ink)">A skill system &#8212; you&#8217;ll build this next.</text>
</svg></body></html>
