<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --amber:rgb(214,140,40); --blue:rgb(52,120,190); --purple:rgb(147,112,219);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<!-- v2-01 · rebuilt 2026-09-23: three levels left to right on the Weekly Email example (DESIGN-SYSTEM §9-§11).
     L1 draft-email/ (one file) · L2 the same draft-email/ grown (one job, several versions) · L3 weekly-email/ lead skill. -->
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) — NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- three equal cards, left to right -->
  <rect x="50"   y="140" width="480" height="770" rx="22" stroke="var(--ink)" stroke-width="4.5" fill="rgba(0,0,0,0.012)"/>
  <rect x="560"  y="140" width="480" height="770" rx="22" stroke="var(--ink)" stroke-width="4.5" fill="rgba(0,0,0,0.012)"/>
  <rect x="1070" y="140" width="480" height="770" rx="22" stroke="var(--ink)" stroke-width="4.5" fill="rgba(0,0,0,0.012)"/>
  <line x1="72"   y1="356" x2="508"  y2="356" stroke="rgb(224,224,222)" stroke-width="2"/>
  <line x1="582"  y1="356" x2="1018" y2="356" stroke="rgb(224,224,222)" stroke-width="2"/>
  <line x1="1092" y1="356" x2="1528" y2="356" stroke="rgb(224,224,222)" stroke-width="2"/>

  <!-- ===== CARD 1 · LEVEL 1 (x0 = 84) ===== -->
  <!-- folder icon: draft-email/ -->
  <rect x="84" y="399" width="16" height="7" rx="2" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="84" y="405" width="36" height="25" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <!-- tree: one child -->
  <line x1="102" y1="436" x2="102" y2="483" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="102" y1="483" x2="134" y2="483" stroke="var(--dim)" stroke-width="2.5"/>
  <!-- REQUIRED badge (ink weight, never a subfolder colour) -->
  <rect x="284" y="464" width="164" height="38" rx="9" stroke="var(--ink)" stroke-width="2.5" fill="var(--bg)"/>
  <!-- the one file, drawn as a page -->
  <path d="M190,560 L352,560 L392,600 L392,820 L190,820 Z" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <polyline points="352,560 352,600 392,600" stroke="var(--ink)" stroke-width="3"/>
  <rect x="212" y="616" width="156" height="58" rx="6" stroke="var(--ink)" stroke-width="2.5" fill="rgba(0,0,0,0.035)"/>
  <line x1="226" y1="636" x2="330" y2="636" stroke="var(--dim)" stroke-width="3"/>
  <line x1="226" y1="656" x2="300" y2="656" stroke="var(--dim)" stroke-width="3"/>
  <line x1="214" y1="702" x2="366" y2="702" stroke="var(--dim)" stroke-width="3"/>
  <line x1="214" y1="728" x2="346" y2="728" stroke="var(--dim)" stroke-width="3"/>
  <line x1="214" y1="754" x2="360" y2="754" stroke="var(--dim)" stroke-width="3"/>
  <line x1="214" y1="780" x2="310" y2="780" stroke="var(--dim)" stroke-width="3"/>

  <!-- ===== CARD 2 · LEVEL 2 (x0 = 594) — the same draft-email/, grown ===== -->
  <rect x="594" y="399" width="16" height="7" rx="2" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="594" y="405" width="36" height="25" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <!-- main spine + ticks -->
  <line x1="612" y1="436" x2="612" y2="793" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="612" y1="481" x2="642" y2="481" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="612" y1="533" x2="648" y2="533" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="612" y1="689" x2="648" y2="689" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="612" y1="741" x2="648" y2="741" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="612" y1="793" x2="648" y2="793" stroke="var(--dim)" stroke-width="2.5"/>
  <rect x="780" y="464" width="164" height="36" rx="9" stroke="var(--ink)" stroke-width="2.5" fill="var(--bg)"/>
  <!-- nested spine under workflows/ -->
  <line x1="666" y1="550" x2="666" y2="637" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="666" y1="585" x2="696" y2="585" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="666" y1="637" x2="696" y2="637" stroke="var(--dim)" stroke-width="2.5"/>
  <!-- workflows/ = GREEN fork (fixed legend) -->
  <line x1="654" y1="533" x2="665" y2="533" stroke="var(--green)" stroke-width="3"/>
  <line x1="665" y1="533" x2="679" y2="523" stroke="var(--green)" stroke-width="3"/>
  <line x1="665" y1="533" x2="679" y2="543" stroke="var(--green)" stroke-width="3"/>
  <circle cx="654" cy="533" r="2.6" fill="var(--green)" stroke="none"/>
  <circle cx="679" cy="523" r="2.6" fill="var(--green)" stroke="none"/>
  <circle cx="679" cy="543" r="2.6" fill="var(--green)" stroke="none"/>
  <!-- scripts/ = AMBER gear -->
  <circle cx="667" cy="689" r="10" stroke="var(--amber)" stroke-width="2.5" fill="var(--bg)"/>
  <circle cx="667" cy="689" r="4" stroke="var(--amber)" stroke-width="2"/>
  <line x1="677" y1="689" x2="681" y2="689" stroke="var(--amber)" stroke-width="2.5"/>
  <line x1="657" y1="689" x2="653" y2="689" stroke="var(--amber)" stroke-width="2.5"/>
  <line x1="667" y1="679" x2="667" y2="675" stroke="var(--amber)" stroke-width="2.5"/>
  <line x1="667" y1="699" x2="667" y2="703" stroke="var(--amber)" stroke-width="2.5"/>
  <line x1="674.1" y1="681.9" x2="676.9" y2="679.1" stroke="var(--amber)" stroke-width="2.5"/>
  <line x1="674.1" y1="696.1" x2="676.9" y2="698.9" stroke="var(--amber)" stroke-width="2.5"/>
  <line x1="659.9" y1="696.1" x2="657.1" y2="698.9" stroke="var(--amber)" stroke-width="2.5"/>
  <line x1="659.9" y1="681.9" x2="657.1" y2="679.1" stroke="var(--amber)" stroke-width="2.5"/>
  <!-- references/ = BLUE open book -->
  <path d="M667,733 C659,729 652,730 648,733 L648,750 C652,747 659,747 667,751 Z" stroke="var(--blue)" stroke-width="2.5" fill="var(--bg)"/>

  <line x1="667" y1="733" x2="667" y2="751" stroke="var(--blue)" stroke-width="2"/>
  <!-- assets/ = PURPLE stacked copy -->
  <rect x="655" y="780" width="18" height="22" rx="3" stroke="var(--purple)" stroke-width="2.5" fill="var(--bg)"/>
  <rect x="661" y="786" width="18" height="22" rx="3" stroke="var(--purple)" stroke-width="2.5" fill="var(--bg)"/>
  <line x1="665" y1="794" x2="675" y2="794" stroke="var(--purple)" stroke-width="1.8"/>
  <line x1="665" y1="800" x2="675" y2="800" stroke="var(--purple)" stroke-width="1.8"/>

  <!-- ===== CARD 3 · LEVEL 3 (x0 = 1104) — weekly-email/, the lead skill ===== -->
  <rect x="1104" y="399" width="16" height="7" rx="2" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="1104" y="405" width="36" height="25" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <!-- run-order badges -->
  <circle cx="1128" cy="561" r="17" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <circle cx="1128" cy="616" r="17" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <circle cx="1128" cy="671" r="17" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <circle cx="1128" cy="726" r="17" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<text x="800" y="84" font-size="60" font-weight="700" text-anchor="middle" fill="var(--ink)">A Skill Grows in Three Levels</text>

<!-- CARD 1 -->
<text x="84" y="194" font-size="26" font-weight="700" letter-spacing="2" fill="var(--dim)">LEVEL 1</text>
<text x="84" y="246" font-size="42" font-weight="700" fill="var(--ink)">Simple</text>
<text x="84" y="292" font-size="28" fill="var(--ink)">one job, one file</text>
<text class="mono" x="134" y="428" font-size="28" font-weight="700" fill="var(--ink)">draft-email/</text>
<text class="mono" x="146" y="492" font-size="28" font-weight="700" fill="var(--ink)">SKILL.md</text>
<text x="366" y="491" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">REQUIRED</text>

<!-- CARD 2 -->
<text x="594" y="194" font-size="26" font-weight="700" letter-spacing="2" fill="var(--dim)">LEVEL 2</text>
<text x="594" y="246" font-size="42" font-weight="700" fill="var(--ink)">With workflows</text>
<text x="594" y="292" font-size="28" fill="var(--ink)">one job, several versions</text>
<text class="mono" x="644" y="428" font-size="28" font-weight="700" fill="var(--ink)">draft-email/</text>

<text x="862" y="490" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">REQUIRED</text>

<text class="mono" x="706" y="594" font-size="26" fill="var(--green)">weekly.md</text>
<text class="mono" x="706" y="646" font-size="26" fill="var(--green)">launch.md</text>
<text class="mono" x="698" y="698" font-size="26" font-weight="700" fill="var(--amber)">scripts/</text>
<text class="mono" x="698" y="750" font-size="26" font-weight="700" fill="var(--blue)">references/</text>
<text class="mono" x="698" y="802" font-size="26" font-weight="700" fill="var(--purple)">assets/</text>
<text x="594" y="872" font-size="26" fill="var(--dim)">the same draft-email/, grown</text>

<!-- CARD 3 -->
<text x="1104" y="194" font-size="26" font-weight="700" letter-spacing="2" fill="var(--dim)">LEVEL 3</text>
<text x="1104" y="246" font-size="42" font-weight="700" fill="var(--ink)">Skill system</text>
<text x="1104" y="292" font-size="28" fill="var(--ink)">a lead skill runs other</text>
<text x="1104" y="328" font-size="28" fill="var(--ink)">skills, in order</text>
<text class="mono" x="1154" y="428" font-size="28" font-weight="700" fill="var(--ink)">weekly-email/</text>

<text x="1128" y="679" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">3</text>
<text x="1128" y="734" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">4</text>
<text class="mono" x="1160" y="570" font-size="26" font-weight="700" fill="var(--ink)">pull-stats/</text>
<text class="mono" x="1160" y="625" font-size="26" font-weight="700" fill="var(--ink)">what-worked/</text>
<text class="mono" x="1160" y="680" font-size="26" font-weight="700" fill="var(--ink)">draft-email/</text>
<text x="1344" y="679" font-size="24" fill="var(--dim)">&#8592; same skill</text>
<text class="mono" x="1160" y="735" font-size="26" font-weight="700" fill="var(--ink)">qa-draft/</text>
<text x="1104" y="836" font-size="26" fill="var(--dim)">what your AI Employee</text>

</svg></body></html>
