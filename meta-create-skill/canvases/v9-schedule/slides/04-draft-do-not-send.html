<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125); --green:rgb(45,140,60); --red:rgb(214,69,58); --orange:#c2410c;
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>

    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>

    <stop offset="100%" stop-color="rgb(45,140,60)" stop-opacity="0"/>

</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== TEXT (crisp, outside #rough) ===================== -->
<text x="800" y="64" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">It Runs Without You. It Does Not Send Without You.</text>
<text x="188" y="318" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">MONDAY, 7:12AM</text>
<text x="168" y="682" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">your AI Employee</text>
<text x="168" y="714" font-size="24" text-anchor="middle" fill="var(--dim)">the draft is done</text>
<text x="528" y="172" font-size="24" font-weight="700" fill="var(--green)">IF IT ONLY TOUCHES YOUR OWN WORK</text>
<text x="763" y="254" font-size="27" text-anchor="middle" fill="var(--ink)">Filing the draft. Updating</text>
<text x="763" y="292" font-size="27" text-anchor="middle" fill="var(--ink)">your sheet. Writing a summary</text>
<text x="763" y="330" font-size="27" text-anchor="middle" fill="var(--ink)">nobody outside sees.</text>
<text x="1312" y="256" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">IT JUST DOES IT</text>
<text x="1312" y="300" font-size="24" text-anchor="middle" fill="var(--dim)">you find it finished,</text>
<text x="1312" y="330" font-size="24" text-anchor="middle" fill="var(--dim)">and you never had to say go</text>
<text x="528" y="562" font-size="24" font-weight="700" fill="var(--red)">IF IT LEAVES THE BUILDING,</text>
<text x="528" y="592" font-size="24" font-weight="700" fill="var(--red)">COSTS MONEY, OR CAN&#8217;T BE UNDONE</text>
<text x="763" y="674" font-size="27" text-anchor="middle" fill="var(--ink)">Sending to your list. Replying</text>
<text x="763" y="712" font-size="27" text-anchor="middle" fill="var(--ink)">to a client. Spending. Posting.</text>
<text x="763" y="750" font-size="27" text-anchor="middle" fill="var(--ink)">Deleting anything.</text>
<text x="1319" y="676" font-size="30" font-weight="700" text-anchor="middle" fill="var(--red)">IT WAITS FOR YOU</text>
<text x="1319" y="720" font-size="24" text-anchor="middle" fill="var(--dim)">drafted, ready, and sitting</text>
<text x="1319" y="750" font-size="24" text-anchor="middle" fill="var(--dim)">there until you say yes</text>
<text x="800" y="944" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">The line is not about trust. It is about what a bad run would cost.</text>
