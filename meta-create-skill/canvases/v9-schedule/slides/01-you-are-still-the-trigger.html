<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58); --orange:#c2410c;
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
  <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgb(45,140,60)" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="rgb(45,140,60)" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="rgb(45,140,60)" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- ============ you, the start button ============ -->
  <circle cx="180" cy="268" r="32" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>

  <line x1="180" y1="330" x2="122" y2="356" stroke="var(--ink)" stroke-width="4"/>
  <line x1="180" y1="330" x2="238" y2="352" stroke="var(--ink)" stroke-width="4"/>
  <line x1="180" y1="392" x2="144" y2="470" stroke="var(--ink)" stroke-width="4"/>
  <line x1="180" y1="392" x2="216" y2="470" stroke="var(--ink)" stroke-width="4"/>

  <!-- the only arrow that ever starts a run -->
  <line x1="256" y1="346" x2="392" y2="346" stroke="var(--red)" stroke-width="4.5"/>
  <polyline points="382,337 392,346 382,355" stroke="var(--red)" stroke-width="4.5"/>

  <!-- ============ the finished employee, waiting ============ -->
  <rect x="416" y="176" width="500" height="384" rx="18" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <line x1="416" y1="232" x2="916" y2="232" stroke="rgb(223,223,221)" stroke-width="2.5"/>

  <!-- it produces the result -->

  <polyline points="1031,337 1040,346 1031,355" stroke="var(--green)" stroke-width="4"/>
  <rect x="1058" y="256" width="480" height="180" rx="16" stroke="var(--green)" stroke-width="4.5" fill="var(--bg)"/>

  <!-- ============ the week strip ============ -->

  <line x1="357" y1="664" x2="357" y2="784" stroke="rgb(228,228,226)" stroke-width="2"/>
  <line x1="534" y1="664" x2="534" y2="784" stroke="rgb(228,228,226)" stroke-width="2"/>

  <line x1="1242" y1="664" x2="1242" y2="784" stroke="rgb(228,228,226)" stroke-width="2"/>
  <!-- ran -->
  <polyline points="254,752 266,766 290,736" stroke="var(--green)" stroke-width="4.5"/>
  <polyline points="608,752 620,766 644,736" stroke="var(--green)" stroke-width="4.5"/>
  <polyline points="785,752 797,766 821,736" stroke="var(--green)" stroke-width="4.5"/>
  <!-- did not -->
  <line x1="431" y1="736" x2="463" y2="768" stroke="var(--red)" stroke-width="4.5"/>
  <line x1="463" y1="736" x2="431" y2="768" stroke="var(--red)" stroke-width="4.5"/>
  <line x1="962" y1="736" x2="994" y2="768" stroke="var(--red)" stroke-width="4.5"/>
  <line x1="994" y1="736" x2="962" y2="768" stroke="var(--red)" stroke-width="4.5"/>
  <line x1="1139" y1="736" x2="1171" y2="768" stroke="var(--red)" stroke-width="4.5"/>
  <line x1="1171" y1="736" x2="1139" y2="768" stroke="var(--red)" stroke-width="4.5"/>
  <line x1="1316" y1="736" x2="1348" y2="768" stroke="var(--red)" stroke-width="4.5"/>
  <line x1="1348" y1="736" x2="1316" y2="768" stroke="var(--red)" stroke-width="4.5"/>

  <!-- ============================================================ -->
  <!-- id="canonical-robot" - VERBATIM. translate(cx-1400*s, feetY-943*s) scale(s)
       s=0.62, cx=560, feetY=530 -->
  <g id="canonical-robot" transform="translate(-308.0,-54.66) scale(0.62)">
    <line x1="1400" y1="660" x2="1400" y2="640" stroke="var(--ink)" stroke-width="4"/>
    <circle cx="1400" cy="632" r="8" fill="var(--green)" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="1400" cy="632" r="15" stroke="var(--green)" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="1356" y="660" width="88" height="80" rx="16" fill="var(--bg)" stroke="var(--ink)" stroke-width="5"/>

    <rect x="1368" y="684" width="64" height="40" rx="9" fill="var(--bg)" stroke="var(--ink)" stroke-width="4"/>
    <circle cx="1385" cy="704" r="14" fill="url(#eyeGlow)"/><circle cx="1415" cy="704" r="14" fill="url(#eyeGlow)"/>
    <circle cx="1385" cy="704" r="7" fill="var(--green)" stroke="var(--ink)" stroke-width="1.5"/>
    <circle cx="1415" cy="704" r="7" fill="var(--green)" stroke="var(--ink)" stroke-width="1.5"/>
    <rect x="1386" y="740" width="28" height="15" rx="5" fill="var(--bg)" stroke="var(--ink)" stroke-width="3.5"/>
    <rect x="1350" y="755" width="100" height="122" rx="16" fill="var(--bg)" stroke="var(--ink)" stroke-width="5"/>
    <rect x="1370" y="774" width="60" height="48" rx="7" stroke="var(--orange)" stroke-width="3.5"/>
    <line x1="1370" y1="790" x2="1430" y2="790" stroke="var(--orange)" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="1380" cy="782" r="3" fill="var(--orange)"/><circle cx="1391" cy="782" r="3" fill="var(--orange)"/><circle cx="1402" cy="782" r="3" fill="var(--orange)"/>
    <rect x="1354.5" y="823" width="5" height="13" rx="2" fill="rgb(214,140,40)" stroke="var(--ink)" stroke-width="1.5"/>
    <circle cx="1357" cy="821" r="5.5" fill="rgb(214,140,40)" stroke="var(--ink)" stroke-width="1.5"/>
    <rect x="1354" y="815.5" width="6" height="5.5" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.2"/>
    <path d="M 1372 820 L 1382 820 L 1385.5 823.5 L 1385.5 836 L 1372 836 Z" fill="rgb(45,140,60)" stroke="var(--ink)" stroke-width="1.5"/>
    <path d="M 1382 820 L 1382 823.5 L 1385.5 823.5" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
    <rect x="1398" y="817" width="4" height="9" fill="rgb(52,120,190)" stroke="var(--ink)" stroke-width="1.2"/>
    <rect x="1396" y="826" width="8" height="10" rx="2.5" fill="rgb(52,120,190)" stroke="var(--ink)" stroke-width="1.5"/>
    <path d="M 1414.5 820 L 1424.5 820 L 1428 823.5 L 1428 836 L 1414.5 836 Z" fill="#9333ea" stroke="var(--ink)" stroke-width="1.5"/>
    <path d="M 1424.5 820 L 1424.5 823.5 L 1428 823.5" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
    <rect x="1436" y="817" width="14" height="6.5" rx="2" fill="rgb(214,69,58)" stroke="var(--ink)" stroke-width="1.5"/>
    <rect x="1440.5" y="823.5" width="4.5" height="12.5" fill="rgb(214,69,58)" stroke="var(--ink)" stroke-width="1.2"/>
    <rect x="1346" y="836" width="108" height="22" rx="5" fill="var(--bg)" stroke="var(--ink)" stroke-width="3.5"/>
    <line x1="1368" y1="836" x2="1368" y2="858" stroke="var(--ink)" stroke-width="2.5"/>
    <line x1="1389" y1="836" x2="1389" y2="858" stroke="var(--ink)" stroke-width="2.5"/>

    <line x1="1432" y1="836" x2="1432" y2="858" stroke="var(--ink)" stroke-width="2.5"/>
    <line x1="1382" y1="877" x2="1380" y2="930" stroke="var(--ink)" stroke-width="13"/>

    <rect x="1360" y="928" width="40" height="15" rx="5" fill="var(--bg)" stroke="var(--ink)" stroke-width="3.5"/>
    <rect x="1402" y="928" width="40" height="15" rx="5" fill="var(--bg)" stroke="var(--ink)" stroke-width="3.5"/>
    <line x1="1352" y1="772" x2="1330" y2="826" stroke="var(--ink)" stroke-width="12"/>
    <line x1="1330" y1="826" x2="1344" y2="860" stroke="var(--ink)" stroke-width="12"/>

  <!-- ============================================================ -->

  <!-- ============ closing divider ============ -->
  <line x1="300" y1="880" x2="1300" y2="880" stroke="rgb(228,228,226)" stroke-width="2.5"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle -->
<text x="800" y="52" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">The Last Thing On Your Plate Is Starting It</text>
<text x="800" y="94" font-size="25" text-anchor="middle" fill="var(--dim)">Everything downstream of the start button is handled. The start button is not.</text>

<!-- you -->
<text x="180" y="516" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">YOU</text>
<text x="324" y="324" font-size="20" font-weight="700" text-anchor="middle" fill="var(--red)">you remembered</text>

<!-- the employee -->
<text x="666" y="152" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">THE EMPLOYEE YOU BUILT</text>
<text class="mono" x="440" y="217" font-size="22" fill="var(--dim)">weekly-email &#183; hardened &#183; harness on</text>
<text x="666" y="592" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WORKING PERFECTLY. WAITING.</text>

<!-- the result -->
<text x="1298" y="230" font-size="21" font-weight="700" text-anchor="middle" fill="var(--green)">WHAT COMES BACK</text>
<text x="1298" y="326" font-size="26" text-anchor="middle" fill="var(--ink)">A finished draft, checked,</text>
<text x="1298" y="366" font-size="26" text-anchor="middle" fill="var(--ink)">in the folder you asked for.</text>
<text x="1298" y="410" font-size="21" font-weight="700" text-anchor="middle" fill="var(--green)">every single time it runs</text>

<!-- the week -->
<text x="800" y="646" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">SO HERE IS WHAT ACTUALLY HAPPENED</text>
<text x="268" y="702" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WEEK 1</text>
<text x="445" y="702" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WEEK 2</text>
<text x="622" y="702" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WEEK 3</text>
<text x="799" y="702" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WEEK 4</text>
<text x="976" y="702" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WEEK 5</text>
<text x="1153" y="702" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WEEK 6</text>
<text x="1330" y="702" font-size="22" font-weight="700" text-anchor="middle" fill="var(--dim)">WEEK 7</text>
<text x="800" y="832" font-size="23" text-anchor="middle" fill="var(--dim)">Three ran. Four never happened. Nothing was wrong with the skill on any of those four.</text>

<!-- one-line takeaway -->
<text x="800" y="946" font-size="27" text-anchor="middle" fill="var(--ink)">It does the job perfectly, on the weeks you remember to ask.</text>
<text x="800" y="994" font-size="30" font-weight="700" text-anchor="middle" fill="var(--red)">You are still the start button.</text>
</svg></body></html>
