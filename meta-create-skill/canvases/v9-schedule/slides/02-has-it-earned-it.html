<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125); --green:rgb(45,140,60); --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<!-- v9-02 - the three things a schedule needs (all built in the last checkpoint); anything missing one is not yet -->
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>

</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - no text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="90" y="200" width="1000" height="118" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <polyline points="128.0,262.0 142.3,277.4 172.0,242.2" stroke="var(--green)" stroke-width="5"/>
  <rect x="90" y="342" width="1000" height="118" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <polyline points="128.0,404.0 142.3,419.4 172.0,384.2" stroke="var(--green)" stroke-width="5"/>
  <rect x="90" y="484" width="1000" height="118" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <polyline points="128.0,546.0 142.3,561.4 172.0,526.2" stroke="var(--green)" stroke-width="5"/>
  <line x1="1104" y1="259" x2="1170" y2="259" stroke="var(--green)" stroke-width="4"/>
  <line x1="1104" y1="401" x2="1170" y2="401" stroke="var(--green)" stroke-width="4"/>
  <line x1="1104" y1="543" x2="1170" y2="543" stroke="var(--green)" stroke-width="4"/>
  <line x1="1170" y1="259" x2="1170" y2="543" stroke="var(--green)" stroke-width="4"/>
  <line x1="1170" y1="401" x2="1238" y2="401" stroke="var(--green)" stroke-width="4.5"/>
  <polyline points="1225.2,408.8 1238.0,401.0 1225.2,393.2" stroke="var(--green)" stroke-width="4.5"/>
  <rect x="1250" y="316" width="290" height="170" rx="16" stroke="var(--green)" stroke-width="4.5" fill="var(--bg)"/>
  <rect x="90" y="672" width="1000" height="118" rx="14" stroke="var(--red)" stroke-width="3.5" fill="var(--bg)" stroke-dasharray="13 11"/>
  <line x1="130" y1="711" x2="170" y2="751" stroke="var(--red)" stroke-width="5"/>
  <line x1="170" y1="711" x2="130" y2="751" stroke="var(--red)" stroke-width="5"/>
  <line x1="1104" y1="731" x2="1238" y2="731" stroke="var(--red)" stroke-width="4.5" stroke-dasharray="13 11"/>
  <polyline points="1225.2,738.8 1238.0,731.0 1225.2,723.2" stroke="var(--red)" stroke-width="4.5"/>
  <rect x="1250" y="672" width="290" height="118" rx="16" stroke="var(--red)" stroke-width="4.5" fill="var(--bg)" stroke-dasharray="14 12"/>
</g>

<!-- ===================== TEXT (crisp, outside #rough) ===================== -->
<text x="800" y="64" font-size="46" font-weight="700" text-anchor="middle" fill="var(--ink)">A Schedule Is Earned, Not Switched On</text>
<text x="590" y="176" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">YOU ALREADY BUILT ALL THREE</text>
<text x="214" y="248" font-size="28" font-weight="700" fill="var(--ink)">It is proven on real work.</text>
<text x="214" y="290" font-size="24" fill="var(--dim)">You have run it on real weeks and used what came back.</text>
<text x="214" y="390" font-size="28" font-weight="700" fill="var(--ink)">It is hardened and passes its scorecard.</text>
<text x="214" y="432" font-size="24" fill="var(--dim)">It stops a bad draft itself, and all 5 tests still pass.</text>
<text x="214" y="532" font-size="28" font-weight="700" fill="var(--ink)">It has a harness on it.</text>
<text x="214" y="574" font-size="24" fill="var(--dim)">The reviewer reads it cold, and the reality check confirms it landed.</text>
<text x="1395" y="393" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">SCHEDULE IT</text>
<text x="1395" y="437" font-size="24" text-anchor="middle" fill="var(--dim)">only with all three</text>
<text x="214" y="720" font-size="28" font-weight="700" fill="var(--ink)">Anything with one of those missing</text>
<text x="214" y="762" font-size="24" fill="var(--dim)">Two good runs are not enough to leave it alone for a month.</text>
<text x="1395" y="722" font-size="28" font-weight="700" text-anchor="middle" fill="var(--red)">NOT YET</text>
<text x="1395" y="760" font-size="24" text-anchor="middle" fill="var(--dim)">you keep starting it</text>
<text x="800" y="944" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">A schedule multiplies whatever it already does, good or bad.</text>
</svg></body></html>
