<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58); --orange:#c2410c;
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
  <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgb(45,140,60)" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="rgb(45,140,60)" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="rgb(45,140,60)" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->

       hour hand ~65% of the minute hand so the two never fuse into one bent line -->

  <line x1="172" y1="404" x2="158" y2="429" stroke="var(--ink)" stroke-width="4"/>

  <polyline points="1051,395 1060,404 1051,413" stroke="var(--dim)" stroke-width="3.5"/>

  <path d="M 1196 360 Q 1210 352 1214 364" stroke="var(--ink)" stroke-width="4" fill="none"/>
  <!-- the mug of coffee -->
  <path d="M 1432 466 L 1440 540 L 1500 540 L 1508 466 Z" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>

  <line x1="1434" y1="480" x2="1506" y2="480" stroke="var(--dim)" stroke-width="2.5"/>

  <path d="M 1456 458 C 1444 444 1468 432 1456 418 C 1448 408 1460 400 1456 392" stroke="var(--dim)" stroke-width="3" fill="none"/>

  <!-- ============ the scope arrow, completed ============ -->
  <path d="M 80 800 L 1340 774 L 1340 750 L 1440 792 L 1340 834 L 1340 810 Z" stroke="var(--green)" stroke-width="4" fill="var(--bg)"/>

  <!-- ============ closing divider ============ -->
  <line x1="300" y1="880" x2="1300" y2="880" stroke="rgb(228,228,226)" stroke-width="2.5"/>

    <rect x="1370" y="774" width="60" height="48" rx="7" stroke="var(--orange)" stroke-width="3.5"/>
    <line x1="1370" y1="790" x2="1430" y2="790" stroke="var(--orange)" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="1380" cy="782" r="3" fill="var(--orange)"/><circle cx="1391" cy="782" r="3" fill="var(--orange)"/><circle cx="1402" cy="782" r="3" fill="var(--orange)"/>
    <rect x="1354.5" y="823" width="5" height="13" rx="2" fill="rgb(214,140,40)" stroke="var(--ink)" stroke-width="1.5"/>
    <circle cx="1357" cy="821" r="5.5" fill="rgb(214,140,40)" stroke="var(--ink)" stroke-width="1.5"/>
    <rect x="1354" y="815.5" width="6" height="5.5" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.2"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle -->
<text x="800" y="52" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">It Runs Monday Morning. You Read The Result.</text>
<text x="800" y="94" font-size="25" text-anchor="middle" fill="var(--dim)">One appearance from you, at the end, on work that is already finished and checked</text>

<!-- 7:00 -->
<text x="290" y="266" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">MONDAY, 7:00AM</text>
<text x="290" y="614" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">It starts itself.</text>
<text x="290" y="650" font-size="22" text-anchor="middle" fill="var(--dim)">nobody asked it to</text>

<!-- 7:12 -->
<text x="800" y="266" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">7:12AM</text>
<text x="800" y="614" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">The draft is in the folder.</text>
<text x="800" y="650" font-size="22" text-anchor="middle" fill="var(--dim)">reviewed, and confirmed to be there</text>

<!-- 9:00 -->
<text x="1300" y="266" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">9:00AM</text>
<text x="1300" y="614" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">You read it and say yes.</text>
<text x="1300" y="650" font-size="22" text-anchor="middle" fill="var(--dim)">the only place you appear</text>

<!-- the scope arrow -->
<text x="230" y="700" font-size="21" font-weight="700" text-anchor="middle" fill="var(--dim)">A SKILL &#183; a task</text>
<text x="700" y="700" font-size="21" font-weight="700" text-anchor="middle" fill="var(--dim)">A SKILL SYSTEM &#183; a function</text>
<text x="1180" y="700" font-size="21" font-weight="700" text-anchor="middle" fill="var(--green)">YOUR AI EMPLOYEE &#183; a worker who owns it</text>
<text x="1180" y="734" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">and now it starts itself</text>

<!-- one-line takeaway -->
<text x="800" y="946" font-size="27" text-anchor="middle" fill="var(--ink)">You went from doing the work, to running the work, to reviewing it.</text>
<text x="800" y="994" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">That is your AI Employee.</text>
