<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(0,40)">

  <!-- ============ LEFT - the week it breaks: a chat reply ============ -->
  <rect x="80" y="206" width="700" height="276" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="80" y1="258" x2="780" y2="258" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <!-- the reply bubble -->
  <rect x="110" y="326" width="620" height="126" rx="22" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>

  <!-- ============ RIGHT - the week it looks perfect: the draft file ============ -->
  <rect x="820" y="206" width="700" height="276" rx="10" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="820" y1="258" x2="1520" y2="258" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <!-- the one made-up line -->
  <rect x="842" y="346" width="656" height="50" rx="7" stroke="var(--red)" stroke-width="3.5" fill="var(--bg)"/>

  <!-- ============ down arrows ============ -->
  <line x1="430" y1="596" x2="430" y2="650" stroke="var(--ink)" stroke-width="4"/>
  <polyline points="421,640 430,650 439,640" stroke="var(--ink)" stroke-width="4"/>
  <line x1="1170" y1="596" x2="1170" y2="650" stroke="var(--red)" stroke-width="4"/>
  <polyline points="1161,640 1170,650 1179,640" stroke="var(--red)" stroke-width="4"/>

  <!-- ============ outcomes ============ -->
  <rect x="170" y="664" width="520" height="176" rx="18" stroke="var(--ink)" stroke-width="4.5" fill="var(--bg)"/>
  <rect x="910" y="664" width="520" height="176" rx="18" stroke="var(--red)" stroke-width="4.5" fill="var(--bg)"/>

</g>
</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle (the only two prose lines) -->
<text x="800" y="62" font-size="46" font-weight="700" text-anchor="middle" fill="var(--ink)">The Loud Failure Was Never the Problem</text>
<text x="800" y="110" font-size="28" text-anchor="middle" fill="var(--dim)">Two ways draft-email/ can get this week&#8217;s email wrong</text>

<g transform="translate(0,40)">
<!-- column headers -->
<text x="430" y="182" font-size="28" font-weight="700" text-anchor="middle" fill="var(--ink)">IT BREAKS LOUDLY</text>
<text x="1170" y="182" font-size="28" font-weight="700" text-anchor="middle" fill="var(--ink)">IT LOOKS PERFECT</text>

<!-- LEFT: the chat -->
<text x="106" y="241" font-size="24" fill="var(--dim)">your chat with the AI</text>
<text x="126" y="310" font-size="24" font-weight="700" fill="var(--dim)">the AI</text>
<text x="420" y="380" font-size="28" text-anchor="middle" fill="var(--ink)">&#8220;I couldn&#8217;t open your stats file,</text>
<text x="420" y="424" font-size="28" text-anchor="middle" fill="var(--ink)">so I didn&#8217;t write this week&#8217;s email.&#8221;</text>

<!-- RIGHT: the draft -->
<text class="mono" x="846" y="241" font-size="24" fill="var(--ink)">drafts/weekly-email.md</text>
<text x="860" y="316" font-size="28" fill="var(--ink)">Hey &#8212; quick one on last week.</text>
<text x="860" y="381" font-size="28" fill="var(--ink)">Open rate hit 34%, our best month yet.</text>
<text x="860" y="446" font-size="28" fill="var(--ink)">The offer closes Friday. PS below.</text>

<!-- what you notice -->
<text x="430" y="542" font-size="28" text-anchor="middle" fill="var(--ink)">You see it straight away.</text>
<text x="1170" y="530" font-size="28" font-weight="700" text-anchor="middle" fill="var(--red)">34% is nowhere in your stats.</text>
<text x="1170" y="570" font-size="28" font-weight="700" text-anchor="middle" fill="var(--red)">Nothing flags it.</text>

<!-- outcomes -->
<text x="430" y="740" font-size="32" text-anchor="middle" fill="var(--ink)">You fix it in two minutes.</text>
<text x="430" y="790" font-size="32" font-weight="700" text-anchor="middle" fill="var(--ink)">Nothing went out.</text>
<text x="1170" y="740" font-size="32" text-anchor="middle" fill="var(--ink)">It goes out to your list,</text>
<text x="1170" y="790" font-size="32" font-weight="700" text-anchor="middle" fill="var(--red)">with your name on it.</text>
</g>
</svg></body></html>
