<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- ============ you, reviewing today's draft ============ -->
  <circle cx="185" cy="462" r="34" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <line x1="185" y1="496" x2="185" y2="594" stroke="var(--ink)" stroke-width="4"/>
  <line x1="185" y1="528" x2="122" y2="554" stroke="var(--ink)" stroke-width="4"/>
  <line x1="185" y1="528" x2="248" y2="554" stroke="var(--ink)" stroke-width="4"/>
  <line x1="185" y1="594" x2="145" y2="684" stroke="var(--ink)" stroke-width="4"/>
  <line x1="185" y1="594" x2="225" y2="684" stroke="var(--ink)" stroke-width="4"/>
  <!-- the draft in hand -->
  <rect x="58" y="518" width="70" height="90" rx="5" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="72" y1="540" x2="114" y2="540" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="72" y1="560" x2="114" y2="560" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="72" y1="580" x2="100" y2="580" stroke="var(--dim)" stroke-width="2.5"/>

  <!-- ============ the thought bubble: your rules ============ -->
  <circle cx="248" cy="424" r="10" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <circle cx="276" cy="398" r="14" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="300" y="182" width="560" height="228" rx="46" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>

  <!-- ============ the gap it never crosses ============ -->
  <line x1="892" y1="296" x2="936" y2="296" stroke="var(--red)" stroke-width="4" stroke-dasharray="12 12"/>
  <line x1="984" y1="296" x2="1028" y2="296" stroke="var(--red)" stroke-width="4" stroke-dasharray="12 12"/>
  <line x1="946" y1="278" x2="974" y2="314" stroke="var(--red)" stroke-width="5"/>
  <line x1="974" y1="278" x2="946" y2="314" stroke="var(--red)" stroke-width="5"/>

  <!-- ============ the file on disk ============ -->
  <rect x="1060" y="182" width="490" height="470" rx="10" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="1060" y1="234" x2="1550" y2="234" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <!-- the empty conventions section -->
  <rect x="1086" y="458" width="438" height="112" rx="8" stroke="var(--red)" stroke-width="3" stroke-dasharray="11 10" fill="var(--bg)"/>

  <!-- ============ closing divider ============ -->
  <line x1="300" y1="880" x2="1300" y2="880" stroke="rgb(228,228,226)" stroke-width="2.5"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle -->
<text x="800" y="52" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">You Already Have Standards. They Are Nowhere On Disk.</text>
<text x="800" y="94" font-size="25" text-anchor="middle" fill="var(--dim)">The rules you apply to every draft, and the file that has never heard of them</text>

<!-- the thought bubble -->
<text x="580" y="140" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">IN YOUR HEAD</text>
<text x="580" y="228" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">WHAT YOU CHECK WITHOUT THINKING</text>
<text x="580" y="288" font-size="25" text-anchor="middle" fill="var(--ink)">never cite a number I didn&#8217;t give it</text>
<text x="580" y="333" font-size="25" text-anchor="middle" fill="var(--ink)">always name the offer</text>
<text x="580" y="378" font-size="25" text-anchor="middle" fill="var(--ink)">never send without the PS</text>

<!-- you -->
<text x="185" y="740" font-size="21" font-weight="700" text-anchor="middle" fill="var(--dim)">YOU, ON EVERY DRAFT</text>

<!-- the gap -->
<text x="960" y="248" font-size="21" font-weight="700" text-anchor="middle" fill="var(--red)">never crossed</text>

<!-- the file -->
<text x="1305" y="140" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">ON DISK</text>
<text class="mono" x="1084" y="219" font-size="22" fill="var(--dim)">weekly-email/SKILL.md</text>
<text class="mono" x="1084" y="286" font-size="22" fill="var(--ink)">## What this does</text>
<text class="mono" x="1084" y="328" font-size="21" fill="var(--dim)">Writes the weekly email from</text>
<text class="mono" x="1084" y="362" font-size="21" fill="var(--dim)">last week&#8217;s stats and my notes.</text>
<text class="mono" x="1084" y="430" font-size="22" fill="var(--ink)">## Conventions</text>
<text x="1305" y="527" font-size="27" text-anchor="middle" fill="var(--red)">nothing here</text>

<!-- the point -->
<text x="1305" y="712" font-size="21" font-weight="700" text-anchor="middle" fill="var(--red)">NOT ONE OF YOUR THREE RULES IS IN THIS FILE</text>
<text x="1305" y="748" font-size="21" text-anchor="middle" fill="var(--dim)">and this file is all the skill ever reads</text>

<!-- one-line takeaway -->
<text x="800" y="946" font-size="27" text-anchor="middle" fill="var(--ink)">You already know exactly how the draft should come back.</text>
<text x="800" y="994" font-size="30" font-weight="700" text-anchor="middle" fill="var(--red)">The skill can only hold itself to a rule you actually wrote down.</text>
</svg></body></html>
