<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58); --amber:rgb(214,140,40); --blue:rgb(52,120,190); --orange:#c2410c;
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>

<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
  <!-- REQUIRED by the canonical robot block -->
  <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgb(45,140,60)" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="rgb(45,140,60)" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="rgb(45,140,60)" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- claim-title + subtitle -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">It Proposes The Edit &#8212; You Are The One Who Approves It</text>
<text x="800" y="100" font-size="25" text-anchor="middle" fill="var(--dim)">Nothing is written into your skill until you say yes</text>

<!-- the AI -->
<text x="175" y="742" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">THE AI</text>

<text x="372" y="316" font-size="20" font-weight="700" fill="var(--dim)">BEFORE</text>
<text class="mono" x="372" y="366" font-size="21" fill="var(--dim)">- Keep it under one page</text>

<text class="mono" x="372" y="654" font-size="21" font-weight="700" fill="var(--green)">+ - No emojis. Not one.</text>

<text x="1350" y="624" font-size="21" text-anchor="middle" fill="var(--dim)">nothing is written,</text>
<text x="1350" y="658" font-size="21" text-anchor="middle" fill="var(--dim)">the file stays as it was</text>

<!-- the guard -->
<text x="800" y="846" font-size="23" text-anchor="middle" fill="var(--dim)">It only proposes what it actually saw go wrong &#8212; it never guesses at a fix</text>

<!-- one-line takeaway -->
<text x="800" y="962" font-size="27" text-anchor="middle" fill="var(--ink)">It drafts the fix and shows you the exact change.</text>
<text x="800" y="1006" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">Nothing lands in your skill until you say yes.</text>
