<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- v5-05 (rebuilt 2026-09-23). ONE job: corrections add up. Starts where v6 left the skill (~80%, a
     strong first draft - never "average at best") and ends at "work you'd put your name on". One step per
     correction; the v5-02/03 correction ("drop the emojis and lead with the number") is ONE step. Weeks,
     not versions. The title does not claim it improves "every run" - only when you correct it. -->
<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- where it starts -->
  <rect x="100" y="620" width="300" height="100" rx="14" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <line x1="300" y1="728" x2="300" y2="792" stroke="var(--dim)" stroke-width="2.5" stroke-dasharray="8 8"/>

  <!-- the staircase - one tread per week, one riser per correction -->
  <polyline points="300,800 480,800 480,710 660,710 660,620 840,620 840,530 1020,530 1020,440 1200,440" stroke="var(--ink)" stroke-width="5"/>

  <!-- by week 5 -->
  <line x1="1200" y1="434" x2="1200" y2="360" stroke="var(--green)" stroke-width="3.5"/>
  <polyline points="1192,369 1200,360 1208,369" stroke="var(--green)" stroke-width="3.5"/>
  <rect x="1000" y="250" width="400" height="100" rx="14" stroke="var(--green)" stroke-width="4" fill="var(--bg)"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">Every Correction Sticks &#8212; And They Add Up</text>
<text x="800" y="104" font-size="28" text-anchor="middle" fill="var(--dim)">One fix each time you notice something. Said once, kept for good.</text>

<text x="250" y="602" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">WHERE IT STARTS</text>
<text x="250" y="662" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">~80%</text>
<text x="250" y="700" font-size="24" text-anchor="middle" fill="var(--ink)">a strong first draft</text>

<text x="390" y="784" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">week 1</text>
<text x="570" y="694" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">week 2</text>
<text x="750" y="604" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">week 3</text>
<text x="930" y="514" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">week 4</text>
<text x="1110" y="424" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">week 5</text>
<text x="494" y="774" font-size="24" font-weight="700" fill="var(--green)">+ no emojis, number first</text>
<text x="674" y="684" font-size="24" font-weight="700" fill="var(--green)">+ plain text, no images</text>
<text x="854" y="594" font-size="24" font-weight="700" fill="var(--green)">+ sign off with your first name</text>
<text x="1034" y="504" font-size="24" font-weight="700" fill="var(--green)">+ subject line under six words</text>

<text x="1200" y="232" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">BY WEEK 5</text>
<text x="1200" y="310" font-size="25" text-anchor="middle" fill="var(--ink)">work you&#8217;d put your name on</text>

</svg></body></html>
