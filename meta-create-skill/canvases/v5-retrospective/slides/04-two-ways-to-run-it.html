<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
 
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- v5-04 (rebuilt 2026-09-23). ONE job: two ways to ask, and both are things you just SAY. No slash
     command on the slide (DESIGN-SYSTEM 11.8 - the buyer may be on Cowork, Claude Code or Codex); no
     "session". Both panels are ink: "right away" / "end of the day" never borrow blue or amber. -->
<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- ============ RIGHT AWAY ============ -->
  <rect x="100" y="160" width="670" height="672" rx="16" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <line x1="130" y1="290" x2="740" y2="290" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <circle cx="166" cy="368" r="18" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <line x1="166" y1="386" x2="166" y2="450" stroke="var(--ink)" stroke-width="4"/>
  <line x1="166" y1="406" x2="136" y2="434" stroke="var(--ink)" stroke-width="4"/>
  <line x1="166" y1="406" x2="196" y2="434" stroke="var(--ink)" stroke-width="4"/>
  <line x1="166" y1="450" x2="142" y2="500" stroke="var(--ink)" stroke-width="4"/>
  <line x1="166" y1="450" x2="190" y2="500" stroke="var(--ink)" stroke-width="4"/>
  <rect x="222" y="340" width="520" height="116" rx="18" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <path d="M 223 356 L 190 368 L 223 384" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <circle cx="150" cy="666" r="6" fill="var(--ink)" stroke="none"/>
  <circle cx="150" cy="720" r="6" fill="var(--ink)" stroke="none"/>
  <circle cx="150" cy="774" r="6" fill="var(--ink)" stroke="none"/>

  <!-- ============ AT THE END OF THE DAY ============ -->
  <rect x="830" y="160" width="670" height="672" rx="16" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <line x1="860" y1="290" x2="1470" y2="290" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <circle cx="896" cy="368" r="18" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <line x1="896" y1="386" x2="896" y2="450" stroke="var(--ink)" stroke-width="4"/>
  <line x1="896" y1="406" x2="866" y2="434" stroke="var(--ink)" stroke-width="4"/>
  <line x1="896" y1="406" x2="926" y2="434" stroke="var(--ink)" stroke-width="4"/>
  <line x1="896" y1="450" x2="872" y2="500" stroke="var(--ink)" stroke-width="4"/>
  <line x1="896" y1="450" x2="920" y2="500" stroke="var(--ink)" stroke-width="4"/>
  <rect x="952" y="340" width="520" height="116" rx="18" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <path d="M 953 356 L 920 368 L 953 384" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <circle cx="880" cy="666" r="6" fill="var(--ink)" stroke="none"/>
  <circle cx="880" cy="720" r="6" fill="var(--ink)" stroke="none"/>
  <circle cx="880" cy="774" r="6" fill="var(--ink)" stroke="none"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">Just Say What Went Wrong &#8212; Right Away, Or At Day&#8217;s End</text>
<text x="800" y="104" font-size="28" text-anchor="middle" fill="var(--dim)">It reads which one you mean from how you say it.</text>

<!-- right away -->
<text x="435" y="218" font-size="32" font-weight="700" text-anchor="middle" fill="var(--ink)">RIGHT AWAY</text>
<text x="435" y="258" font-size="24" text-anchor="middle" fill="var(--dim)">this week&#8217;s email just came back wrong</text>
<text x="130" y="330" font-size="24" font-weight="700" fill="var(--dim)">YOU SAY</text>
<text x="482" y="407" font-size="26" text-anchor="middle" fill="var(--ink)">&#8220;That was wrong &#8212; fix the skill.&#8221;</text>
<text x="166" y="538" font-size="24" text-anchor="middle" fill="var(--dim)">you</text>
<text x="130" y="612" font-size="24" font-weight="700" fill="var(--dim)">IT DOES</text>
<text x="172" y="674" font-size="25" fill="var(--ink)">looks at the skill you just used</text>
<text x="172" y="728" font-size="25" fill="var(--ink)">drafts one fix</text>
<text x="172" y="782" font-size="25" fill="var(--ink)">you say yes, and it&#8217;s in</text>

<!-- end of the day -->
<text x="1165" y="218" font-size="32" font-weight="700" text-anchor="middle" fill="var(--ink)">AT THE END OF THE DAY</text>
<text x="1165" y="258" font-size="24" text-anchor="middle" fill="var(--dim)">you&#8217;re done working for the day</text>
<text x="860" y="330" font-size="24" font-weight="700" fill="var(--dim)">YOU SAY</text>
<text x="1212" y="407" font-size="26" text-anchor="middle" fill="var(--ink)">&#8220;Review what went wrong today.&#8221;</text>
<text x="896" y="538" font-size="24" text-anchor="middle" fill="var(--dim)">you</text>
<text x="860" y="612" font-size="24" font-weight="700" fill="var(--dim)">IT DOES</text>
<text x="902" y="674" font-size="25" fill="var(--ink)">looks back at every skill you used today</text>
<text x="902" y="728" font-size="25" fill="var(--ink)">drafts every fix it found</text>
<text x="902" y="782" font-size="25" fill="var(--ink)">you approve them all in one go</text>
</svg></body></html>
