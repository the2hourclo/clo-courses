<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255);  --ink:rgb(33,33,33);  --dim:rgb(120,120,125);
  --green:rgb(45,140,60);  --blue:rgb(52,120,190);  --amber:rgb(214,140,40);  --purple:rgb(147,112,219);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);}
.mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===== SHAPES (wobble) - NO text in here ===== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- the folder, opened: a plain file window (title bar = the folder name) -->
  <rect x="210" y="168" width="1180" height="808" rx="24" stroke="var(--ink)" stroke-width="5" fill="var(--bg)"/>
  <circle cx="248" cy="204" r="8" stroke="var(--dim)" stroke-width="3"/>
  <circle cx="276" cy="204" r="8" stroke="var(--dim)" stroke-width="3"/>
  <circle cx="304" cy="204" r="8" stroke="var(--dim)" stroke-width="3"/>
  <line x1="222" y1="240" x2="1378" y2="240" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <!-- folder glyph in the title bar -->
  <path d="M 342 194 L 342 190 L 354 190 L 358 194" stroke="var(--ink)" stroke-width="3"/>
  <rect x="340" y="194" width="32" height="22" rx="3" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>

  <!-- tree lines: level 1 -->
  <line x1="262" y1="318" x2="262" y2="870" stroke="var(--dim)" stroke-width="3"/>
  <line x1="262" y1="370" x2="304" y2="370" stroke="var(--dim)" stroke-width="3"/>
  <line x1="262" y1="446" x2="304" y2="446" stroke="var(--dim)" stroke-width="3"/>
  <line x1="262" y1="630" x2="304" y2="630" stroke="var(--dim)" stroke-width="3"/>
  <line x1="262" y1="750" x2="304" y2="750" stroke="var(--dim)" stroke-width="3"/>
  <line x1="262" y1="870" x2="304" y2="870" stroke="var(--dim)" stroke-width="3"/>
  <!-- tree lines: level 2 (the files inside each folder) -->
  <line x1="388" y1="468" x2="388" y2="566" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="512" x2="422" y2="512" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="566" x2="422" y2="566" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="652" x2="388" y2="686" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="686" x2="422" y2="686" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="772" x2="388" y2="806" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="806" x2="422" y2="806" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="892" x2="388" y2="926" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="388" y1="926" x2="422" y2="926" stroke="var(--dim)" stroke-width="2.5"/>

  <!-- SKILL.md = the one REQUIRED file: ink badge, never a subfolder colour -->
  <rect x="584" y="350" width="178" height="40" rx="9" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>

  <!-- ===== FIXED SUBFOLDER LEGEND ICONS ===== -->
  <!-- workflows/ = one path splitting into two, GREEN -->
  <g>
  <path d="M 318.3 446 L 329.9 446 L 346.6 435.5" stroke="var(--green)" stroke-width="3"/>
  <path d="M 329.9 446 L 346.6 456.5" stroke="var(--green)" stroke-width="3"/>
  <polyline points="343.4,443.1 346.6,435.5 338.4,435.1" stroke="var(--green)" stroke-width="3"/>
  <polyline points="338.4,456.9 346.6,456.5 343.4,448.9" stroke="var(--green)" stroke-width="3"/>
  </g>
  <!-- scripts/ = cog with square teeth, AMBER -->
  <g>
  <path d="M 329.8 620.9 L 330 617.2 L 334 617.2 L 334.2 620.9 L 336.9 622 L 339.6 619.5 L 342.5 622.4 L 340 625.1 L 341.1 627.8 L 344.8 628 L 344.8 632 L 341.1 632.2 L 340 634.9 L 342.5 637.6 L 339.6 640.5 L 336.9 638 L 334.2 639.1 L 334 642.8 L 330 642.8 L 329.8 639.1 L 327.1 638 L 324.4 640.5 L 321.5 637.6 L 324 634.9 L 322.9 632.2 L 319.2 632 L 319.2 628 L 322.9 627.8 L 324 625.1 L 321.5 622.4 L 324.4 619.5 L 327.1 622 Z" stroke="var(--amber)" stroke-width="2.6" fill="var(--bg)"/>
  <circle cx="332" cy="630" r="3.9" stroke="var(--amber)" stroke-width="2.6"/>
  </g>
  <!-- references/ = open book, BLUE -->
  <line x1="332" y1="743" x2="332" y2="758" stroke="var(--blue)" stroke-width="2.5"/>
  <path d="M332,743 L318,747 L318,760 L332,756 Z" stroke="var(--blue)" stroke-width="3"/>
  <path d="M332,743 L346,747 L346,760 L332,756 Z" stroke="var(--blue)" stroke-width="3"/>
  <!-- assets/ = stacked copies, PURPLE -->
  <rect x="329" y="859" width="15" height="19" rx="2" stroke="var(--purple)" stroke-width="3"/>
  <rect x="321" y="864" width="15" height="19" rx="2" fill="var(--bg)" stroke="var(--purple)" stroke-width="3"/>
</g>

<!-- ===== TEXT (crisp) - everything below is OUTSIDE the filter ===== -->
<text x="800" y="82" font-size="50" font-weight="700" text-anchor="middle" fill="var(--ink)">A Skill Is Just a Folder With One Required File</text>
<text x="800" y="128" font-size="28" text-anchor="middle" fill="var(--dim)">the four folders are optional &#8212; add one only when the skill needs it</text>

<!-- title bar = the folder name -->
<text x="386" y="213" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">draft-email</text>

<!-- root -->
<text class="mono" x="244" y="302" font-size="34" font-weight="700" text-anchor="start" fill="var(--ink)">draft-email/</text>

<!-- SKILL.md (required) -->
<text class="mono" x="318" y="381" font-size="32" font-weight="700" text-anchor="start" fill="var(--ink)">SKILL.md</text>
<text x="673" y="379" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">REQUIRED</text>
<text x="800" y="380" font-size="26" text-anchor="start" fill="var(--dim)">your rules + the order</text>

<!-- workflows/ -->
<text class="mono" x="360" y="457" font-size="32" font-weight="700" text-anchor="start" fill="var(--green)">workflows/</text>
<text x="673" y="455" font-size="24" text-anchor="middle" fill="var(--dim)">optional</text>
<text x="800" y="456" font-size="26" text-anchor="start" fill="var(--dim)">the steps for each version</text>
<text class="mono" x="432" y="521" font-size="28" text-anchor="start" fill="var(--ink)">weekly.md</text>
<text class="mono" x="432" y="575" font-size="28" text-anchor="start" fill="var(--ink)">launch.md</text>

<!-- scripts/ -->
<text class="mono" x="360" y="641" font-size="32" font-weight="700" text-anchor="start" fill="var(--amber)">scripts/</text>
<text x="673" y="639" font-size="24" text-anchor="middle" fill="var(--dim)">optional</text>
<text x="800" y="640" font-size="26" text-anchor="start" fill="var(--dim)">code that runs the same way every time</text>
<text class="mono" x="432" y="695" font-size="28" text-anchor="start" fill="var(--ink)">check-links.py</text>

<!-- references/ -->
<text class="mono" x="360" y="761" font-size="32" font-weight="700" text-anchor="start" fill="var(--blue)">references/</text>
<text x="673" y="759" font-size="24" text-anchor="middle" fill="var(--dim)">optional</text>
<text x="800" y="760" font-size="26" text-anchor="start" fill="var(--dim)">the gotchas</text>
<text class="mono" x="432" y="815" font-size="28" text-anchor="start" fill="var(--ink)">voice-rules.md</text>

<!-- assets/ -->
<text class="mono" x="360" y="881" font-size="32" font-weight="700" text-anchor="start" fill="var(--purple)">assets/</text>
<text x="673" y="879" font-size="24" text-anchor="middle" fill="var(--dim)">optional</text>
<text x="800" y="880" font-size="26" text-anchor="start" fill="var(--dim)">your best email</text>
<text class="mono" x="432" y="935" font-size="28" text-anchor="start" fill="var(--ink)">best-email.md</text>
</svg></body></html>
