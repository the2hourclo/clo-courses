<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===== SHAPES (wobble) - NO text in here ===== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- file tab + card: the top of draft-email/SKILL.md -->
  <rect x="110" y="200" width="318" height="46" rx="12" fill="var(--bg)" stroke="var(--ink)" stroke-width="4"/>
  <rect x="110" y="242" width="1380" height="732" rx="20" fill="var(--bg)" stroke="var(--ink)" stroke-width="4"/>

  <!-- REQUIRED pill (same badge as 02) + the two required lines in an ink box -->
  <rect x="150" y="318" width="178" height="40" rx="9" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>
  <rect x="134" y="370" width="1332" height="142" rx="12" fill="rgba(33,33,33,0.035)" stroke="var(--ink)" stroke-width="4"/>

  <!-- dotted leaders: each line -> its plain-words meaning -->
  <line x1="452" y1="417" x2="836" y2="417" stroke="rgb(200,200,198)" stroke-width="2.5" stroke-dasharray="2 9"/>
  <line x1="732" y1="477" x2="836" y2="477" stroke="rgb(200,200,198)" stroke-width="2.5" stroke-dasharray="2 9"/>
  <line x1="316" y1="623" x2="836" y2="623" stroke="rgb(200,200,198)" stroke-width="2.5" stroke-dasharray="2 9"/>
  <line x1="378" y1="685" x2="836" y2="685" stroke="rgb(200,200,198)" stroke-width="2.5" stroke-dasharray="2 9"/>
  <line x1="394" y1="747" x2="836" y2="747" stroke="rgb(200,200,198)" stroke-width="2.5" stroke-dasharray="2 9"/>
  <line x1="456" y1="809" x2="836" y2="809" stroke="rgb(200,200,198)" stroke-width="2.5" stroke-dasharray="2 9"/>
  <line x1="676" y1="871" x2="836" y2="871" stroke="rgb(200,200,198)" stroke-width="2.5" stroke-dasharray="2 9"/>
</g>

<!-- ===== TEXT (crisp) - everything below is OUTSIDE the filter ===== -->
<text x="800" y="80" font-size="52" font-weight="700" text-anchor="middle" fill="var(--ink)">The Header Needs Two Lines. The Rest Can Wait.</text>
<text x="800" y="126" font-size="28" text-anchor="middle" fill="var(--dim)">the header, called frontmatter, is everything between the two --- lines</text>

<text class="mono" x="269" y="231" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">draft-email/SKILL.md</text>

<text class="mono" x="160" y="298" font-size="28" fill="var(--dim)">---</text>
<text x="239" y="347" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">REQUIRED</text>

<!-- required -->
<text class="mono" x="160" y="426" font-size="28" font-weight="700" fill="var(--ink)">name:</text>
<text class="mono" x="262" y="426" font-size="28" fill="var(--ink)">draft-email</text>
<text x="860" y="426" font-size="27" fill="var(--ink)">its name &#8212; the same as its folder</text>
<text class="mono" x="160" y="486" font-size="28" font-weight="700" fill="var(--ink)">description:</text>
<text x="380" y="486" font-size="27" fill="var(--ink)">Writes this week&#8217;s email&#8230;</text>
<text x="860" y="486" font-size="27" fill="var(--ink)">tells the AI when to use it</text>

<!-- optional: grey, regular weight -->
<text x="160" y="570" font-size="26" fill="rgb(138,138,138)">optional &#183; safe to ignore for now</text>
<text class="mono" x="160" y="632" font-size="28" fill="rgb(138,138,138)">model:</text>
<text class="mono" x="280" y="632" font-size="28" fill="rgb(138,138,138)">&#8230;</text>
<text x="860" y="632" font-size="27" fill="rgb(138,138,138)">which AI model runs it</text>
<text class="mono" x="160" y="694" font-size="28" fill="rgb(138,138,138)">effort:</text>
<text class="mono" x="296" y="694" font-size="28" fill="rgb(138,138,138)">high</text>
<text x="860" y="694" font-size="27" fill="rgb(138,138,138)">how hard it thinks</text>
<text class="mono" x="160" y="756" font-size="28" fill="rgb(138,138,138)">context:</text>
<text class="mono" x="312" y="756" font-size="28" fill="rgb(138,138,138)">fork</text>
<text x="860" y="756" font-size="27" fill="rgb(138,138,138)">starts with a clean slate</text>
<text class="mono" x="160" y="818" font-size="28" fill="rgb(138,138,138)">allowed-tools:</text>
<text class="mono" x="422" y="818" font-size="28" fill="rgb(138,138,138)">&#8230;</text>
<text x="860" y="818" font-size="27" fill="rgb(138,138,138)">which tools it may use</text>
<text class="mono" x="160" y="880" font-size="28" fill="rgb(138,138,138)">disable-model-invocation:</text>
<text class="mono" x="594" y="880" font-size="28" fill="rgb(138,138,138)">true</text>
<text x="860" y="880" font-size="27" fill="rgb(138,138,138)">only runs when you ask for it by name</text>

<text class="mono" x="160" y="940" font-size="28" fill="var(--dim)">---</text>
</svg></body></html>
