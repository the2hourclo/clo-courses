<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --amber:rgb(214,140,40); --blue:rgb(52,120,190); --purple:rgb(147,112,219);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>

<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ============ TEXT (all crisp, OUTSIDE #rough) ============ -->
<text x="800" y="80" font-size="54" font-weight="700" text-anchor="middle" fill="var(--ink)">Each Folder Answers One Question the AI Asks</text>
<text x="800" y="128" font-size="28" text-anchor="middle" fill="var(--dim)">the four folders inside draft-email/ &#183; each with a real file from it</text>

<!-- workflows/ -->
<text x="218" y="264" font-size="42" font-weight="700" text-anchor="start" fill="var(--green)">workflows/</text>
<text x="120" y="338" font-size="28" font-weight="700" text-anchor="start" fill="var(--ink)">“Which version is this — weekly or launch?”</text>
<text class="mono" x="140" y="395" font-size="24" font-weight="700" text-anchor="start" fill="var(--green)">workflows/weekly.md</text>
<text x="140" y="444" font-size="24" text-anchor="start" fill="var(--ink)">1. Sum up the week in three lines</text>
<text x="140" y="478" font-size="24" text-anchor="start" fill="var(--ink)">2. One story, one link</text>
<text x="140" y="512" font-size="24" text-anchor="start" fill="var(--ink)">3. End on one question</text>
<!-- scripts/ -->
<text x="958" y="264" font-size="42" font-weight="700" text-anchor="start" fill="var(--amber)">scripts/</text>
<text x="860" y="338" font-size="28" font-weight="700" text-anchor="start" fill="var(--ink)">“What must run the same way every time?”</text>
<text class="mono" x="880" y="395" font-size="24" font-weight="700" text-anchor="start" fill="var(--amber)">scripts/check-links.py</text>
<text class="mono" x="880" y="444" font-size="24" text-anchor="start" fill="var(--ink)">for link in draft.links:</text>
<text class="mono" x="938" y="478" font-size="24" text-anchor="start" fill="var(--ink)">check(link)   # does it open?</text>
<!-- references/ -->
<text x="218" y="676" font-size="42" font-weight="700" text-anchor="start" fill="var(--blue)">references/</text>
<text x="120" y="750" font-size="28" font-weight="700" text-anchor="start" fill="var(--ink)">“What mistakes do I avoid?”</text>
<text class="mono" x="140" y="807" font-size="24" font-weight="700" text-anchor="start" fill="var(--blue)">references/voice-rules.md</text>
<text x="140" y="856" font-size="24" text-anchor="start" fill="var(--ink)">– never open with “Hope you’re well”</text>
<text x="140" y="890" font-size="24" text-anchor="start" fill="var(--ink)">– say “you”, not “our customers”</text>
<!-- assets/ -->
<text x="958" y="676" font-size="42" font-weight="700" text-anchor="start" fill="var(--purple)">assets/</text>
<text x="860" y="750" font-size="28" font-weight="700" text-anchor="start" fill="var(--ink)">“What should the email look like?”</text>
<text class="mono" x="880" y="807" font-size="24" font-weight="700" text-anchor="start" fill="var(--purple)">assets/best-email.md</text>
<text x="880" y="856" font-size="24" text-anchor="start" fill="var(--ink)">Subject: What I got wrong last week</text>
<text x="880" y="890" font-size="24" text-anchor="start" fill="var(--ink)">Hey — quick one this week…</text>
