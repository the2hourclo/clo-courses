<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- card chrome: signal tag + severity badge (identical on all eight cards) -->
  <rect x="50" y="28" width="501" height="46" rx="23" stroke="var(--dim)" stroke-width="2.5" fill="var(--bg)"/>
  <rect x="1250" y="28" width="300" height="46" rx="23" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>

  <!-- ============ LEFT: one skill doing three unrelated jobs ============ -->

  <line x1="60" y1="228" x2="760" y2="228" stroke="var(--ink)" stroke-width="2"/>
  <circle cx="90" cy="202" r="6" fill="var(--dim)" stroke="none"/>
  <circle cx="112" cy="202" r="6" fill="var(--dim)" stroke="none"/>
  <circle cx="134" cy="202" r="6" fill="var(--dim)" stroke="none"/>
  <rect x="160" y="190" width="16" height="7" rx="2" stroke="var(--ink)" stroke-width="2.5" fill="var(--bg)"/>
  <rect x="160" y="196" width="34" height="22" rx="3" stroke="var(--ink)" stroke-width="2.5" fill="var(--bg)"/>
  <line x1="80" y1="330" x2="740" y2="330" stroke="rgb(228,228,226)" stroke-width="2"/>

  <!-- brackets: three unrelated jobs -->
  <line x1="470" y1="407" x2="470" y2="443" stroke="var(--ink)" stroke-width="3"/>

  <line x1="458" y1="667" x2="470" y2="667" stroke="var(--ink)" stroke-width="3"/>

  <!-- each job's files move to their own skill -->
  <line x1="580" y1="420" x2="864" y2="292" stroke="var(--ink)" stroke-width="3"/>
  <polyline points="848,292 866,291 857,307" stroke="var(--ink)" stroke-width="3"/>
  <line x1="614" y1="509" x2="864" y2="486" stroke="var(--ink)" stroke-width="3"/>
  <polyline points="851,478 866,486 852,494" stroke="var(--ink)" stroke-width="3"/>
  <line x1="580" y1="621" x2="864" y2="679" stroke="var(--ink)" stroke-width="3"/>
  <polyline points="853,669 866,680 851,686" stroke="var(--ink)" stroke-width="3"/>

  <!-- ============ RIGHT: three focused skills ============ -->
  <rect x="880" y="228" width="64" height="16" rx="4" stroke="var(--ink)" stroke-width="2.5" fill="var(--bg)"/>
  <rect x="880" y="240" width="660" height="110" rx="12" stroke="var(--ink)" stroke-width="3" fill="rgba(0,0,0,0.015)"/>
  <rect x="880" y="420" width="64" height="16" rx="4" stroke="var(--ink)" stroke-width="2.5" fill="var(--bg)"/>
  <rect x="880" y="432" width="660" height="110" rx="12" stroke="var(--ink)" stroke-width="3" fill="rgba(0,0,0,0.015)"/>
  <rect x="880" y="612" width="64" height="16" rx="4" stroke="var(--ink)" stroke-width="2.5" fill="var(--bg)"/>
  <rect x="880" y="624" width="660" height="110" rx="12" stroke="var(--ink)" stroke-width="3" fill="rgba(0,0,0,0.015)"/>
  <!-- THE FIX box (same place on all eight cards) -->
  <rect x="50" y="812" width="1500" height="156" rx="18" stroke="var(--ink)" stroke-width="2.5" fill="rgba(0,0,0,0.02)"/>
  <line x1="276" y1="834" x2="276" y2="946" stroke="rgb(223,223,221)" stroke-width="2"/>
  <polyline points="84,888 96,902 120,872" stroke="var(--green)" stroke-width="5"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<!-- card chrome text -->
<text x="72" y="60" font-size="24" font-weight="700" text-anchor="start" fill="var(--ink)">SIGNAL 6 OF 8 &#183; OVERLOADED SKILL</text>
<text x="1400" y="60" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">SEVERITY &#183; MEDIUM</text>

<text x="800" y="140" font-size="50" font-weight="700" text-anchor="middle" fill="var(--ink)">One Skill Doing Unrelated Jobs Should Be Split</text>

<!-- left -->
<text class="mono" x="206" y="213" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">weekly-email/</text>
<text class="mono" x="88" y="276" font-size="24" text-anchor="start" fill="var(--dim)">description:</text>
<text class="mono" x="114" y="310" font-size="24" text-anchor="start" fill="var(--ink)">Runs the weekly email. Now invoices, hiring too.</text>
<text class="mono" x="80" y="378" font-size="26" text-anchor="start" fill="var(--ink)" xml:space="preserve">&#9492;&#9472;&#9472;</text>
<text class="mono" x="137.2" y="378" font-size="26" font-weight="700" text-anchor="start" fill="var(--green)">workflows/</text>
<text class="mono" x="80" y="434" font-size="26" text-anchor="start" fill="var(--ink)" xml:space="preserve">    &#9500;&#9472;&#9472; run-weekly.md</text>
<text class="mono" x="80" y="490" font-size="26" text-anchor="start" fill="var(--ink)" xml:space="preserve">    &#9500;&#9472;&#9472; send-invoice.md</text>

<text x="488" y="434" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">email</text>
<text x="488" y="518" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">invoices</text>
<text x="488" y="630" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">hiring</text>

<!-- right -->
<text class="mono" x="906" y="286" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">weekly-email/</text>
<text class="mono" x="906" y="326" font-size="24" text-anchor="start" fill="var(--ink)">run-weekly.md</text>
<text class="mono" x="906" y="478" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">invoices/</text>
<text class="mono" x="906" y="518" font-size="24" text-anchor="start" fill="var(--ink)">send-invoice.md &#183; chase-late.md</text>
<text class="mono" x="906" y="670" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">hiring/</text>
<text class="mono" x="906" y="710" font-size="24" text-anchor="start" fill="var(--ink)">job-post.md &#183; interviews.md</text>
<text x="1210" y="772" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">5 workflows in, 5 out &#8212; nothing lost</text>

<!-- the fix -->
<text x="300" y="876" font-size="30" font-weight="700" text-anchor="start" fill="var(--ink)">Split it by job: the email, invoices and hiring each get a skill.</text>
<text x="300" y="922" font-size="26" text-anchor="start" fill="var(--dim)">weekly-email/ goes back to one job: running the weekly email.</text>

<text x="132" y="900" font-size="28" font-weight="700" text-anchor="start" fill="var(--ink)">THE FIX</text>
</svg></body></html>
