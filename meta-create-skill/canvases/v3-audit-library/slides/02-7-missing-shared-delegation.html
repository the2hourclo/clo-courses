<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- card chrome: signal tag + severity badge (identical on all eight cards) -->
  <rect x="50" y="28" width="443" height="46" rx="23" stroke="var(--dim)" stroke-width="2.5" fill="var(--bg)"/>
  <rect x="1250" y="28" width="300" height="46" rx="23" stroke="var(--ink)" stroke-width="3" fill="var(--bg)"/>

  <!-- ============ two skills, each with its own copy of the same step ============ -->
  <rect x="60" y="176" width="640" height="400" rx="18" stroke="var(--ink)" stroke-width="2.5" fill="rgba(0,0,0,0.015)"/>
  <line x1="60" y1="236" x2="700" y2="236" stroke="var(--ink)" stroke-width="2"/>
  <rect x="74" y="334" width="612" height="112" rx="10" fill="rgba(120,120,125,0.12)" stroke="none"/>

  <rect x="900" y="176" width="640" height="400" rx="18" stroke="var(--ink)" stroke-width="2.5" fill="rgba(0,0,0,0.015)"/>
  <line x1="900" y1="236" x2="1540" y2="236" stroke="var(--ink)" stroke-width="2"/>
  <rect x="914" y="334" width="612" height="112" rx="10" fill="rgba(120,120,125,0.12)" stroke="none"/>

  <!-- the same block, written twice -->
  <line x1="700" y1="436" x2="900" y2="436" stroke="var(--ink)" stroke-width="3"/>
  <line x1="700" y1="426" x2="700" y2="446" stroke="var(--ink)" stroke-width="3"/>
  <line x1="900" y1="426" x2="900" y2="446" stroke="var(--ink)" stroke-width="3"/>
  <!-- THE FIX box (same place on all eight cards) -->
  <rect x="50" y="812" width="1500" height="156" rx="18" stroke="var(--ink)" stroke-width="2.5" fill="rgba(0,0,0,0.02)"/>
  <line x1="276" y1="834" x2="276" y2="946" stroke="rgb(223,223,221)" stroke-width="2"/>
  <polyline points="84,888 96,902 120,872" stroke="var(--green)" stroke-width="5"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<!-- card chrome text -->
<text x="72" y="60" font-size="24" font-weight="700" text-anchor="start" fill="var(--ink)">SIGNAL 7 OF 8 &#183; COPIED STEPS</text>
<text x="1400" y="60" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">SEVERITY &#183; MEDIUM</text>

<text x="800" y="140" font-size="50" font-weight="700" text-anchor="middle" fill="var(--ink)">A Step Copied Into Two Skills Drifts Apart</text>

<!-- left card -->
<text class="mono" x="88" y="216" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">draft-email/SKILL.md</text>
<text class="mono" x="88" y="282" font-size="24" font-weight="700" text-anchor="start" fill="var(--ink)">## Steps</text>
<text class="mono" x="88" y="318" font-size="24" text-anchor="start" fill="var(--ink)">1. write this week&#8217;s email</text>
<text class="mono" x="88" y="362" font-size="24" text-anchor="start" fill="var(--ink)">2. check it against my voice rules:</text>
<text class="mono" x="88" y="396" font-size="24" text-anchor="start" fill="var(--ink)" xml:space="preserve">   &#183; always add a P.S.</text>
<text class="mono" x="88" y="430" font-size="24" text-anchor="start" fill="var(--ink)" xml:space="preserve">   &#183; lead with the number</text>
<text x="436" y="430" font-size="24" font-weight="700" text-anchor="start" fill="var(--ink)">&#8592; new rule</text>
<text class="mono" x="88" y="484" font-size="24" text-anchor="start" fill="var(--ink)">3. save it to drafts/</text>
<text x="88" y="546" font-size="24" text-anchor="start" fill="var(--dim)">updated last week</text>

<!-- right card -->
<text class="mono" x="928" y="216" font-size="26" font-weight="700" text-anchor="start" fill="var(--ink)">weekly-email/SKILL.md</text>
<text class="mono" x="928" y="282" font-size="24" font-weight="700" text-anchor="start" fill="var(--ink)">## Steps</text>
<text class="mono" x="928" y="318" font-size="24" text-anchor="start" fill="var(--ink)">1. run the other skills</text>
<text class="mono" x="928" y="362" font-size="24" text-anchor="start" fill="var(--ink)">2. check it against my voice rules:</text>
<text class="mono" x="928" y="396" font-size="24" text-anchor="start" fill="var(--ink)" xml:space="preserve">   &#183; always add a P.S.</text>
<text class="mono" x="928" y="430" font-size="24" font-weight="700" text-anchor="start" fill="var(--red)" xml:space="preserve">   missing: lead with the number</text>
<text class="mono" x="928" y="484" font-size="24" text-anchor="start" fill="var(--ink)">3. send you the draft</text>
<text x="928" y="546" font-size="24" font-weight="700" text-anchor="start" fill="var(--red)">never got the new rule</text>

<!-- between the cards -->
<text x="800" y="384" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">same step,</text>
<text x="800" y="414" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ink)">written twice</text>

<!-- consequence -->
<text x="800" y="716" font-size="28" font-weight="700" text-anchor="middle" fill="var(--red)">You updated one copy. The other copy never heard about it.</text>

<!-- the fix -->
<text x="300" y="876" font-size="30" font-weight="700" text-anchor="start" fill="var(--ink)">Give the step one home: qa-draft/. Both skills hand off to it.</text>
<text class="mono" x="300" y="922" font-size="24" text-anchor="start" fill="var(--ink)">draft-email/ &#8594; qa-draft/ &#8592; weekly-email/</text>
<text x="880" y="922" font-size="24" text-anchor="start" fill="var(--dim)">one copy, one place to update</text>

<text x="132" y="900" font-size="28" font-weight="700" text-anchor="start" fill="var(--ink)">THE FIX</text>
</svg></body></html>
