<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- ============ what it reported - a chat message ============ -->
  <rect x="70" y="180" width="640" height="200" rx="20" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <path d="M 130 380 L 130 412 L 172 380" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <polyline points="98,262 112,278 142,244" stroke="var(--ink)" stroke-width="4.5"/>

  <!-- ============ the not-equals ============ -->
  <line x1="762" y1="262" x2="838" y2="262" stroke="var(--red)" stroke-width="6"/>
  <line x1="762" y1="296" x2="838" y2="296" stroke="var(--red)" stroke-width="6"/>
  <line x1="822" y1="234" x2="778" y2="324" stroke="var(--red)" stroke-width="6"/>

  <!-- ============ what is actually there - a real folder ============ -->
  <rect x="890" y="180" width="640" height="200" rx="10" stroke="var(--red)" stroke-width="4" fill="var(--bg)"/>
  <line x1="890" y1="232" x2="1530" y2="232" stroke="rgb(223,223,221)" stroke-width="2.5"/>

  <!-- ============ what the harness does ============ -->
  <rect x="380" y="470" width="840" height="284" rx="16" stroke="var(--green)" stroke-width="4.5" fill="var(--bg)"/>
  <line x1="380" y1="536" x2="1220" y2="536" stroke="rgb(228,228,226)" stroke-width="2.5"/>

  <!-- ============ closing divider ============ -->
  <line x1="300" y1="880" x2="1300" y2="880" stroke="rgb(228,228,226)" stroke-width="2.5"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle -->
<text x="800" y="52" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">A Report Is Not Evidence</text>
<text x="800" y="94" font-size="25" text-anchor="middle" fill="var(--dim)">The skill did not lie to you. It told you what it meant to do.</text>

<!-- what it reported -->
<text x="390" y="152" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">WHAT IT REPORTED</text>
<text x="164" y="270" font-size="26" fill="var(--ink)">Done. Draft saved to</text>
<text class="mono" x="164" y="322" font-size="24" fill="var(--ink)">/drafts/weekly-email.md</text>
<text x="164" y="362" font-size="22" fill="var(--dim)">Ready for your review.</text>

<!-- what is actually there -->
<text x="1210" y="152" font-size="21" font-weight="700" text-anchor="middle" fill="var(--red)">WHAT IS ACTUALLY THERE</text>
<text class="mono" x="914" y="217" font-size="22" fill="var(--dim)">~/drafts</text>
<text class="mono" x="914" y="284" font-size="26" fill="var(--ink)">drafts/</text>
<text class="mono" x="914" y="330" font-size="26" fill="var(--red)">&#9492;&#9472;&#9472; (nothing)</text>
<text x="914" y="366" font-size="21" fill="var(--dim)">last written 6 days ago</text>

<!-- what the harness does -->
<text x="800" y="518" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">SO THE HARNESS GOES AND LOOKS</text>
<text class="mono" x="800" y="586" font-size="24" text-anchor="middle" fill="var(--dim)">&gt; open /drafts/weekly-email.md</text>
<text class="mono" x="800" y="634" font-size="24" font-weight="700" text-anchor="middle" fill="var(--red)">not there.</text>
<text x="800" y="700" font-size="26" font-weight="700" text-anchor="middle" fill="var(--green)">The run is not done. It comes back to you unfinished,</text>
<text x="800" y="734" font-size="26" font-weight="700" text-anchor="middle" fill="var(--green)">instead of filed as complete.</text>

<!-- one-line takeaway -->
<text x="800" y="946" font-size="27" text-anchor="middle" fill="var(--ink)">No rule in the file could have caught this. The skill never looked.</text>
<text x="800" y="994" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">Something outside it has to open the folder and check.</text>
</svg></body></html>
