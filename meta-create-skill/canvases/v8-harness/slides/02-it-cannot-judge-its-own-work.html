html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}

<!-- claim-title + subtitle -->
<text x="800" y="52" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">The Writer Cannot Hear Its Own Voice</text>
<text x="800" y="94" font-size="25" text-anchor="middle" fill="var(--dim)">The same draft, read by the one that wrote it and by one that never saw it written</text>

<!-- the draft -->
<text class="mono" x="484" y="177" font-size="22" fill="var(--dim)">drafts/weekly-email.md</text>
<text x="800" y="238" font-size="25" text-anchor="middle" fill="var(--ink)">&#8220;We are pleased to share this week&#8217;s</text>
<text x="800" y="281" font-size="25" text-anchor="middle" fill="var(--ink)">key learnings and actionable insights.&#8221;</text>
<text x="800" y="348" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">EVERY RULE IN THE FILE FOLLOWED. NOTHING HERE BREAKS ONE.</text>

<!-- LEFT lane -->
<text x="330" y="452" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">THE ONE THAT WROTE IT</text>
<text x="196" y="810" font-size="20" font-weight="700" text-anchor="middle" fill="var(--red)">A CLOSED LOOP</text>
<text x="196" y="838" font-size="20" text-anchor="middle" fill="var(--dim)">it chose those words</text>
<text x="556" y="600" font-size="24" text-anchor="middle" fill="var(--ink)">&#8220;Reads well. Clear</text>
<text x="556" y="638" font-size="24" text-anchor="middle" fill="var(--ink)">and professional.&#8221;</text>
<text x="556" y="682" font-size="21" font-weight="700" text-anchor="middle" fill="var(--red)">it approved its own work</text>

<!-- RIGHT lane -->
<text x="1270" y="452" font-size="21" font-weight="700" text-anchor="middle" fill="var(--green)">THE ONE THAT NEVER SAW IT WRITTEN</text>
<text x="976" y="810" font-size="20" font-weight="700" text-anchor="middle" fill="var(--green)">NO MEMORY OF WRITING IT</text>
<text x="976" y="838" font-size="20" text-anchor="middle" fill="var(--dim)">reading it cold, first time</text>
<text x="1319" y="570" font-size="24" text-anchor="middle" fill="var(--ink)">&#8220;Three sentences in a row</text>
<text x="1319" y="608" font-size="24" text-anchor="middle" fill="var(--ink)">with nobody in them. This</text>
<text x="1319" y="646" font-size="24" text-anchor="middle" fill="var(--ink)">reads like a press release,</text>
<text x="1319" y="684" font-size="24" text-anchor="middle" fill="var(--ink)">not like you.&#8221;</text>

<!-- one-line takeaway -->
<text x="800" y="946" font-size="27" text-anchor="middle" fill="var(--ink)">It is not a smarter reviewer, and it is not a better prompt.</text>
<text x="800" y="994" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">The distance is the whole mechanism.</text>
