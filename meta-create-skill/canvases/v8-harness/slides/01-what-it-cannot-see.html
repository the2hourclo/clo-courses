<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(0,52)">

  <!-- ============ the hardened skill: the same file v7 built ============ -->
  <rect x="400" y="150" width="800" height="300" rx="10" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="400" y1="202" x2="1200" y2="202" stroke="rgb(223,223,221)" stroke-width="2.5"/>

  <!-- ============ fan-out: three runs come OUT of the skill ============ -->
  <line x1="800" y1="452" x2="800" y2="482" stroke="var(--dim)" stroke-width="3.5"/>
  <line x1="275" y1="482" x2="1325" y2="482" stroke="var(--dim)" stroke-width="3.5"/>
  <line x1="275" y1="482" x2="275" y2="512" stroke="var(--dim)" stroke-width="3.5"/>
  <polyline points="267,503 275,512 283,503" stroke="var(--dim)" stroke-width="3.5"/>
  <line x1="800" y1="482" x2="800" y2="512" stroke="var(--dim)" stroke-width="3.5"/>
  <polyline points="792,503 800,512 808,503" stroke="var(--dim)" stroke-width="3.5"/>
  <line x1="1325" y1="482" x2="1325" y2="512" stroke="var(--dim)" stroke-width="3.5"/>
  <polyline points="1317,503 1325,512 1333,503" stroke="var(--dim)" stroke-width="3.5"/>

  <!-- ============ the three bad runs ============ -->
  <rect x="50" y="520" width="450" height="210" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="575" y="520" width="450" height="210" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="1100" y="520" width="450" height="210" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>

  <!-- ============ verdicts ============ -->
  <line x1="275" y1="732" x2="275" y2="768" stroke="var(--ink)" stroke-width="4"/>
  <polyline points="267,759 275,768 283,759" stroke="var(--ink)" stroke-width="4"/>
  <rect x="140" y="776" width="270" height="76" rx="14" stroke="var(--ink)" stroke-width="4.5" fill="var(--bg)"/>
  <line x1="800" y1="732" x2="800" y2="768" stroke="var(--red)" stroke-width="4"/>
  <polyline points="792,759 800,768 808,759" stroke="var(--red)" stroke-width="4"/>
  <rect x="610" y="776" width="380" height="76" rx="14" stroke="var(--red)" stroke-width="4.5" fill="var(--bg)"/>
  <line x1="1325" y1="732" x2="1325" y2="768" stroke="var(--red)" stroke-width="4"/>
  <polyline points="1317,759 1325,768 1333,759" stroke="var(--red)" stroke-width="4"/>
  <rect x="1135" y="776" width="380" height="76" rx="14" stroke="var(--red)" stroke-width="4.5" fill="var(--bg)"/>

</g>
</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle (the only two prose lines) -->
<text x="800" y="62" font-size="46" font-weight="700" text-anchor="middle" fill="var(--ink)">Hardening Did Its Job. Two Got Through Anyway.</text>
<text x="800" y="110" font-size="28" text-anchor="middle" fill="var(--dim)">Three bad runs of the hardened skill</text>

<g transform="translate(0,52)">
<!-- the hardened skill -->
<text class="mono" x="424" y="186" font-size="24" fill="var(--ink)">draft-email/SKILL.md</text>
<text class="mono" x="430" y="244" font-size="24" font-weight="700" fill="var(--ink)">## Your rules</text>
<text class="mono" x="430" y="280" font-size="24" fill="var(--ink)">- only use numbers from the stats</text>
<text class="mono" x="430" y="314" font-size="24" fill="var(--ink)">- always name the offer</text>
<text class="mono" x="430" y="348" font-size="24" fill="var(--ink)">- &#8230;</text>
<text class="mono" x="430" y="394" font-size="24" font-weight="700" fill="var(--ink)">## Self-check before handing it over</text>
<text class="mono" x="430" y="428" font-size="24" fill="var(--ink)">- read the draft against every rule</text>

<!-- run 1 -->
<text x="275" y="614" font-size="30" text-anchor="middle" fill="var(--ink)">&#8220;Open rate hit 34%,</text>
<text x="275" y="660" font-size="30" text-anchor="middle" fill="var(--ink)">our best month yet.&#8221;</text>
<text x="275" y="827" font-size="34" font-weight="700" text-anchor="middle" fill="var(--ink)">STOPPED</text>

<!-- run 2 -->
<text x="800" y="592" font-size="30" text-anchor="middle" fill="var(--ink)">&#8220;We are pleased to share</text>
<text x="800" y="636" font-size="30" text-anchor="middle" fill="var(--ink)">this week&#8217;s key learnings</text>
<text x="800" y="680" font-size="30" text-anchor="middle" fill="var(--ink)">and actionable insights.&#8221;</text>
<text x="800" y="827" font-size="34" font-weight="700" text-anchor="middle" fill="var(--red)">GOT THROUGH</text>

<!-- run 3 -->
<text x="1325" y="614" font-size="30" text-anchor="middle" fill="var(--ink)">&#8220;Done &#8212; saved to</text>
<text class="mono" x="1325" y="660" font-size="26" text-anchor="middle" fill="var(--ink)">drafts/weekly-email.md&#8221;</text>
<text x="1325" y="827" font-size="34" font-weight="700" text-anchor="middle" fill="var(--red)">GOT THROUGH</text>
</g>
</svg></body></html>
