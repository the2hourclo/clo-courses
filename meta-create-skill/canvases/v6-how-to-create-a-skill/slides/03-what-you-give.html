<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58); --amber:rgb(214,140,40); --blue:rgb(52,120,190); --purple:rgb(147,112,219);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== SHAPES (all inside #rough) — NO text =====================
     Deliberately NO subfolder names or colour legend on this slide. Where each input is
     filed is the AI's problem, not the buyer's, and naming workflows//references//assets/
     at the moment they are being asked to DO something read as plumbing.
     (Rashid, 2026-07-26: "I don't want people confused with workflows assets and
     references — I just want them to know what to give.") -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <rect x="90" y="170" width="1420" height="126" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="152" cy="233" r="24" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>

  <rect x="90" y="300" width="1420" height="126" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="152" cy="363" r="24" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>

  <rect x="90" y="430" width="1420" height="126" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="152" cy="493" r="24" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>

  <rect x="90" y="560" width="1420" height="126" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="152" cy="623" r="24" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>

  <rect x="90" y="690" width="1420" height="126" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="152" cy="753" r="24" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>

  <!-- the divider between "what it is" and "what yours looks like" -->
  <line x1="720" y1="190" x2="720" y2="796" stroke="rgb(228,228,226)" stroke-width="2.5"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">Five Things You Give It, And You Already Have All Five</text>
<text x="800" y="100" font-size="25" text-anchor="middle" fill="var(--dim)">The interview is just pulling these out of your head and writing them down</text>

<text x="770" y="146" font-size="18" font-weight="700" fill="var(--dim)">WHAT YOURS MIGHT LOOK LIKE</text>

<!-- 1 — the steps -->
<text x="152" y="242" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">1</text>
<text x="200" y="225" font-size="28" font-weight="700" fill="var(--ink)">THE STEPS</text>
<text x="200" y="257" font-size="19" fill="var(--dim)">what you do first, second, third</text>
<text class="mono" x="770" y="225" font-size="19" fill="var(--dim)">pull last week&#8217;s numbers, find the three winners,</text>
<text class="mono" x="770" y="257" font-size="19" fill="var(--dim)">draft it, then check it against the rules</text>

<!-- 2 — the framework -->
<text x="152" y="372" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">2</text>
<text x="200" y="355" font-size="28" font-weight="700" fill="var(--ink)">YOUR FRAMEWORK</text>
<text x="200" y="387" font-size="19" fill="var(--dim)">the method you follow without thinking</text>
<text class="mono" x="770" y="355" font-size="19" fill="var(--dim)">the 5 checks you run on every draft</text>
<text class="mono" x="770" y="387" font-size="19" fill="var(--dim)">how you decide a week actually counts as a win</text>

<!-- 3 — the gold standard -->
<text x="152" y="502" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">3</text>
<text x="200" y="485" font-size="28" font-weight="700" fill="var(--ink)">YOUR GOLD STANDARD</text>
<text x="200" y="517" font-size="19" fill="var(--dim)">one real example you were happy to send</text>
<text class="mono" x="770" y="485" font-size="19" fill="var(--dim)">last quarter&#8217;s report, the good one</text>
<text class="mono" x="770" y="517" font-size="19" fill="var(--dim)">not a description of it, the actual file</text>

<!-- 4 — the assets -->
<text x="152" y="632" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">4</text>
<text x="200" y="615" font-size="28" font-weight="700" fill="var(--ink)">YOUR ASSETS</text>
<text x="200" y="647" font-size="19" fill="var(--dim)">the real files it should work from</text>
<text class="mono" x="770" y="615" font-size="19" fill="var(--dim)">your brand and tone doc, the template you start from</text>
<text class="mono" x="770" y="647" font-size="19" fill="var(--dim)">the dashboard export, last month&#8217;s numbers</text>

<!-- 5 — the edge cases -->
<text x="152" y="762" font-size="24" font-weight="700" text-anchor="middle" fill="var(--green)">5</text>
<text x="200" y="745" font-size="28" font-weight="700" fill="var(--ink)">THE EDGE CASES</text>
<text x="200" y="777" font-size="19" fill="var(--dim)">where it changes, and what else it covers</text>
<text class="mono" x="770" y="745" font-size="19" fill="var(--dim)">a launch week gets its own format</text>
<text class="mono" x="770" y="777" font-size="19" fill="var(--dim)">the same skill also does the monthly roll-up</text>

<!-- one-line takeaway -->
<text x="800" y="962" font-size="27" text-anchor="middle" fill="var(--ink)">You are not inventing a single one of these.</text>
<text x="800" y="1006" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">It is how you already work, finally said out loud.</text>
</svg></body></html>
