<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
 
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- v6-03 (rebuilt 2026-09-23). ONE job: the five things you give, in the SAME label set as the
     v6-02 / v6-06 file headings (1:1 with the five interview questions). Right column = how much
     detail is enough, at 25px ink. No subfolder names, no legend colours. -->
<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <rect x="70" y="186" width="1460" height="136" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="128" cy="254" r="24" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="735" y1="204" x2="735" y2="304" stroke="rgb(228,228,226)" stroke-width="2.5"/>
  <rect x="70" y="338" width="1460" height="136" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="128" cy="406" r="24" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="735" y1="356" x2="735" y2="456" stroke="rgb(228,228,226)" stroke-width="2.5"/>
  <rect x="70" y="490" width="1460" height="136" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="128" cy="558" r="24" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="735" y1="508" x2="735" y2="608" stroke="rgb(228,228,226)" stroke-width="2.5"/>
  <rect x="70" y="642" width="1460" height="136" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="128" cy="710" r="24" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="735" y1="660" x2="735" y2="760" stroke="rgb(228,228,226)" stroke-width="2.5"/>
  <rect x="70" y="794" width="1460" height="136" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <circle cx="128" cy="862" r="24" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="735" y1="812" x2="735" y2="912" stroke="rgb(228,228,226)" stroke-width="2.5"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">Five Things You Give It, And You Already Have All Five</text>
<text x="800" y="104" font-size="28" text-anchor="middle" fill="var(--dim)">One for each question the interview asks.</text>
<text x="96" y="166" font-size="24" font-weight="700" fill="var(--dim)">WHAT YOU GIVE</text>
<text x="765" y="166" font-size="24" font-weight="700" fill="var(--dim)">HOW MUCH DETAIL IS ENOUGH &#183; the weekly email</text>
<text x="128" y="263" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">1</text>
<text x="176" y="264" font-size="28" font-weight="700" fill="var(--ink)">The steps, in the order you do them</text>
<text x="765" y="244" font-size="25" fill="var(--ink)">Read last week&#8217;s numbers, pick the three winners,</text>
<text x="765" y="282" font-size="25" fill="var(--ink)">write it, then check it against your rules.</text>
<text x="128" y="415" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">2</text>
<text x="176" y="416" font-size="28" font-weight="700" fill="var(--ink)">The framework you follow</text>
<text x="765" y="415" font-size="25" fill="var(--ink)">The problem, one story, one ask. Never two asks.</text>
<text x="128" y="567" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">3</text>
<text x="176" y="568" font-size="28" font-weight="700" fill="var(--ink)">Your gold standard</text>
<text x="765" y="548" font-size="25" fill="var(--ink)">The best weekly email you&#8217;ve sent. The real</text>
<text x="765" y="586" font-size="25" fill="var(--ink)">email, not a description of it.</text>
<text x="128" y="719" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">4</text>
<text x="176" y="720" font-size="28" font-weight="700" fill="var(--ink)">Your real files</text>
<text x="765" y="700" font-size="25" fill="var(--ink)">Last week&#8217;s numbers, exactly as you export them,</text>
<text x="765" y="738" font-size="25" fill="var(--ink)">plus anything you always copy from.</text>
<text x="128" y="871" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">5</text>
<text x="176" y="872" font-size="28" font-weight="700" fill="var(--ink)">The exceptions</text>
<text x="765" y="852" font-size="25" fill="var(--ink)">Launch week gets its own format.</text>
<text x="765" y="890" font-size="25" fill="var(--ink)">A holiday week: five lines, no numbers.</text>
</svg></body></html>
