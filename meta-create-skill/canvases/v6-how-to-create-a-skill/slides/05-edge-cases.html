<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- v6-05 (rebuilt 2026-09-23). ONE lesson: name where the job changes (the exceptions) and ONE skill
     covers every version - "one job, several versions" (DESIGN-SYSTEM section 10), never "more than one
     job". ONE number everywhere: three. Headings ink; red = the failure path, green = the good outcome.
     No subfolder names (draft-email/ is the skill itself, not a subfolder). -->
<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- middle divider -->
  <line x1="800" y1="150" x2="800" y2="870" stroke="rgb(223,223,221)" stroke-width="2.5" stroke-dasharray="12 12"/>

  <!-- ============ LEFT - leave them out: three near-copies ============ -->
  <rect x="120" y="240" width="520" height="120" rx="12" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="138" y="222" width="110" height="22" rx="6" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="150" y="405" width="520" height="120" rx="12" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="168" y="387" width="110" height="22" rx="6" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="180" y="570" width="520" height="120" rx="12" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="198" y="552" width="110" height="22" rx="6" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>

  <!-- ============ RIGHT - name them once: one file, three versions ============ -->
  <rect x="850" y="232" width="330" height="46" rx="10" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="850" y="276" width="660" height="214" rx="12" stroke="var(--ink)" stroke-width="4" fill="var(--bg)"/>
  <!-- fork: one file -> three versions -->
  <line x1="1180" y1="498" x2="1180" y2="540" stroke="var(--dim)" stroke-width="3"/>
  <line x1="947" y1="540" x2="1413" y2="540" stroke="var(--dim)" stroke-width="3"/>
  <line x1="947" y1="540" x2="947" y2="586" stroke="var(--dim)" stroke-width="3"/>
  <polyline points="940,578 947,586 954,578" stroke="var(--dim)" stroke-width="3"/>
  <line x1="1180" y1="540" x2="1180" y2="586" stroke="var(--dim)" stroke-width="3"/>
  <polyline points="1173,578 1180,586 1187,578" stroke="var(--dim)" stroke-width="3"/>
  <line x1="1413" y1="540" x2="1413" y2="586" stroke="var(--dim)" stroke-width="3"/>
  <polyline points="1406,578 1413,586 1420,578" stroke="var(--dim)" stroke-width="3"/>
  <rect x="850" y="596" width="195" height="100" rx="12" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="1082" y="596" width="196" height="100" rx="12" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>
  <rect x="1315" y="596" width="195" height="100" rx="12" stroke="var(--green)" stroke-width="3.5" fill="var(--bg)"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">Tell It Where The Job Changes &#8212; One Skill, Every Version</text>
<text x="800" y="104" font-size="28" text-anchor="middle" fill="var(--dim)">The exceptions are the fifth thing you give, and the one people skip.</text>

<!-- LEFT -->
<text x="410" y="178" font-size="28" font-weight="700" text-anchor="middle" fill="var(--ink)">LEAVE THEM OUT</text>
<text class="mono" x="150" y="310" font-size="26" fill="var(--ink)">draft-email/</text>
<text class="mono" x="180" y="475" font-size="26" fill="var(--ink)">draft-launch-email/</text>
<text class="mono" x="210" y="640" font-size="26" fill="var(--ink)">draft-holiday-email/</text>
<text class="mono" x="616" y="310" font-size="24" text-anchor="end" fill="var(--dim)">SKILL.md</text>
<text class="mono" x="646" y="475" font-size="24" text-anchor="end" fill="var(--dim)">SKILL.md</text>
<text class="mono" x="676" y="640" font-size="24" text-anchor="end" fill="var(--dim)">SKILL.md</text>
<text x="410" y="790" font-size="28" font-weight="700" text-anchor="middle" fill="var(--red)">three near-copies to keep in sync</text>
<text x="410" y="828" font-size="24" text-anchor="middle" fill="var(--dim)">fix one, and the other two drift</text>

<!-- RIGHT -->
<text x="1180" y="178" font-size="28" font-weight="700" text-anchor="middle" fill="var(--ink)">NAME THEM ONCE</text>
<text class="mono" x="868" y="264" font-size="24" fill="var(--ink)">draft-email/SKILL.md</text>
<text x="872" y="334" font-size="26" font-weight="700" fill="var(--dim)">##</text>
<text x="918" y="334" font-size="26" font-weight="700" fill="var(--ink)">The exceptions</text>
<text class="mono" x="890" y="392" font-size="24" fill="var(--ink)">- launch week &#8594; its own format</text>
<text class="mono" x="890" y="446" font-size="24" fill="var(--ink)">- holiday week &#8594; five lines</text>
<text x="947" y="654" font-size="24" text-anchor="middle" fill="var(--ink)">weekly email</text>
<text x="1180" y="654" font-size="24" text-anchor="middle" fill="var(--ink)">launch email</text>
<text x="1413" y="654" font-size="24" text-anchor="middle" fill="var(--ink)">holiday email</text>
<text x="1180" y="790" font-size="28" font-weight="700" text-anchor="middle" fill="var(--green)">one job, several versions</text>
<text x="1180" y="828" font-size="24" text-anchor="middle" fill="var(--dim)">one file covers all three</text>
</svg></body></html>
