<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58); --amber:rgb(214,140,40); --blue:rgb(52,120,190); --purple:rgb(147,112,219); --orange:#c2410c;
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
  <!-- REQUIRED by the canonical robot block -->
  <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgb(45,140,60)" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="rgb(45,140,60)" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="rgb(45,140,60)" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->

<!-- claim-title + subtitle -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">All Five, In One Place It Reads Every Time</text>
<text x="800" y="100" font-size="25" text-anchor="middle" fill="var(--dim)">You say it once. You do not maintain it, and you do not repeat it.</text>

<!-- the skill -->
<text x="210" y="200" font-size="17" font-weight="700" text-anchor="middle" fill="var(--ink)">YOUR SKILL</text>
<text x="495" y="252" font-size="30" font-weight="700" text-anchor="middle" fill="var(--ink)">the weekly report</text>

<text x="185" y="356" font-size="23" fill="var(--ink)">The steps, in your order</text>
<text x="185" y="446" font-size="23" fill="var(--ink)">The framework you follow</text>
<text x="185" y="536" font-size="23" fill="var(--ink)">Your gold standard</text>
<text x="185" y="626" font-size="23" fill="var(--ink)">Your real files</text>
<text x="185" y="716" font-size="23" fill="var(--ink)">The edge cases</text>

<!-- the AI -->
<text x="1000" y="622" font-size="21" font-weight="700" text-anchor="middle" fill="var(--ink)">THE AI</text>
<text x="1000" y="650" font-size="18" text-anchor="middle" fill="var(--dim)">reads all of it, every run</text>

<!-- what comes back -->
<text x="1335" y="318" font-size="20" font-weight="700" text-anchor="middle" fill="var(--green)">WHAT COMES BACK</text>
<text x="1335" y="400" font-size="23" text-anchor="middle" fill="var(--ink)">~80% to your standard</text>
<text x="1335" y="438" font-size="21" text-anchor="middle" fill="var(--dim)">ready to generate revenue</text>
<text x="1335" y="486" font-size="19" text-anchor="middle" fill="var(--dim)">and it sounds like you</text>

<!-- the point -->

<!-- one-line takeaway -->
<text x="800" y="962" font-size="27" text-anchor="middle" fill="var(--ink)">Almost none of this came from the AI.</text>
<text x="800" y="1006" font-size="30" font-weight="700" text-anchor="middle" fill="var(--green)">It came from how you already work, written down at last.</text>
