<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face{font-family:'Excalifont';src:url('Excalifont-Regular.woff2') format('woff2');}
:root{
  --bg:rgb(255,255,255); --ink:rgb(33,33,33); --dim:rgb(120,120,125);
  --green:rgb(45,140,60); --red:rgb(214,69,58);
  --sans:"Excalifont",Inter,system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1600px;height:1050px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
svg{display:block;} text{font-family:var(--sans);} .mono{font-family:var(--mono);}
</style></head><body>
<svg viewBox="0 0 1600 1050" width="1600" height="1050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.2" fill="rgb(224,224,222)"/></pattern>
</defs>

<rect width="1600" height="1050" fill="var(--bg)"/>
<rect width="1600" height="1050" fill="url(#dots)" opacity="0.5"/>

<!-- v6-04 (rebuilt 2026-09-23). ONE job: a real example beats describing it. Gold standard = the best
     weekly email you've sent (best-email.md). Output promise per DESIGN-SYSTEM section 10: ~80% to your
     standard - never "every run matches it". -->
<!-- ===================== SHAPES (all inside #rough) - NO text ===================== -->
<g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- middle divider -->
  <line x1="800" y1="150" x2="800" y2="900" stroke="rgb(223,223,221)" stroke-width="2.5" stroke-dasharray="12 12"/>

  <!-- ============ LEFT - describing it ============ -->
  <rect x="110" y="195" width="630" height="300" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="425" y1="508" x2="425" y2="560" stroke="var(--dim)" stroke-width="3"/>
  <polyline points="418,552 425,560 432,552" stroke="var(--dim)" stroke-width="3"/>
  <!-- the email it guesses at -->
  <rect x="190" y="570" width="470" height="230" rx="12" stroke="var(--red)" stroke-width="4" fill="var(--bg)"/>
  <line x1="190" y1="628" x2="660" y2="628" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <path d="M 230 680 q 40 -12 80 0 t 80 0 t 80 0 t 80 0 t 80 0" stroke="var(--dim)" stroke-width="3"/>
  <path d="M 230 725 q 40 -12 80 0 t 80 0 t 80 0 t 80 0 t 80 0" stroke="var(--dim)" stroke-width="3"/>
  <path d="M 230 770 q 40 -12 80 0 t 80 0" stroke="var(--dim)" stroke-width="3"/>

  <!-- ============ RIGHT - handing it over ============ -->
  <rect x="860" y="195" width="630" height="300" rx="14" stroke="var(--ink)" stroke-width="3.5" fill="var(--bg)"/>
  <line x1="860" y1="252" x2="1490" y2="252" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <line x1="1175" y1="508" x2="1175" y2="560" stroke="var(--dim)" stroke-width="3"/>
  <polyline points="1168,552 1175,560 1182,552" stroke="var(--dim)" stroke-width="3"/>
  <!-- the email that has something to copy -->
  <rect x="940" y="570" width="470" height="230" rx="12" stroke="var(--green)" stroke-width="4" fill="var(--bg)"/>
  <line x1="940" y1="628" x2="1410" y2="628" stroke="rgb(223,223,221)" stroke-width="2.5"/>
  <polyline points="975,716 996,738 1036,690" stroke="var(--green)" stroke-width="5"/>
  <line x1="1066" y1="680" x2="1376" y2="680" stroke="var(--dim)" stroke-width="3"/>
  <line x1="1066" y1="725" x2="1376" y2="725" stroke="var(--dim)" stroke-width="3"/>
  <line x1="1066" y1="770" x2="1260" y2="770" stroke="var(--dim)" stroke-width="3"/>

</g>

<!-- ===================== TEXT (all crisp, OUTSIDE #rough) ===================== -->
<text x="800" y="58" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">One Real Example Beats A Paragraph Of Adjectives</text>
<text x="800" y="104" font-size="28" text-anchor="middle" fill="var(--dim)">Your gold standard is the best weekly email you&#8217;ve already sent.</text>

<!-- LEFT -->
<text x="425" y="176" font-size="28" font-weight="700" text-anchor="middle" fill="var(--ink)">DESCRIBING IT</text>
<text class="mono" x="150" y="272" font-size="24" fill="var(--ink)">- make it professional</text>
<text class="mono" x="150" y="322" font-size="24" fill="var(--ink)">- keep it punchy</text>
<text class="mono" x="150" y="372" font-size="24" fill="var(--ink)">- on brand</text>
<text class="mono" x="150" y="422" font-size="24" fill="var(--ink)">- high quality</text>
<text x="222" y="610" font-size="24" fill="var(--dim)">the email it writes</text>
<text x="425" y="852" font-size="28" font-weight="700" text-anchor="middle" fill="var(--red)">a generic email</text>
<text x="425" y="890" font-size="24" text-anchor="middle" fill="var(--dim)">it guesses again, every week</text>

<!-- RIGHT -->
<text x="1175" y="176" font-size="28" font-weight="700" text-anchor="middle" fill="var(--ink)">HANDING IT OVER</text>
<text class="mono" x="886" y="235" font-size="24" fill="var(--dim)">best-email.md</text>
<text x="886" y="298" font-size="26" font-weight="700" fill="var(--ink)">Subject: 3 things that worked last week</text>
<text x="886" y="342" font-size="24" fill="var(--ink)">Short one today. Three things worked:</text>
<text x="886" y="382" font-size="24" fill="var(--ink)">1. The Tuesday post doubled replies</text>
<text x="886" y="422" font-size="24" fill="var(--ink)">2. One reply became two new clients</text>
<text x="886" y="462" font-size="24" fill="var(--dim)">3. &#8230;</text>
<text x="972" y="610" font-size="24" fill="var(--dim)">the email it writes</text>
<text x="1175" y="852" font-size="28" font-weight="700" text-anchor="middle" fill="var(--green)">~80% to your standard</text>
<text x="1175" y="890" font-size="24" text-anchor="middle" fill="var(--dim)">it has the real email to copy</text>
</svg></body></html>
